<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><title>دیباگ Supabase</title>
<style>
body{font-family:sans-serif;padding:15px;direction:rtl;font-size:13px;}
button{background:#1b6b3a;color:#fff;border:none;padding:8px 15px;border-radius:8px;font-size:13px;cursor:pointer;margin:4px;}
pre{background:#f0f0f0;padding:10px;border-radius:8px;font-size:11px;overflow-x:auto;white-space:pre-wrap;max-height:300px;overflow-y:auto;}
h3{margin:10px 0 5px;}
</style></head>
<body>
<h2>🔍 دیباگ Supabase</h2>

<h3>همه کلیدهای FARM2020:</h3>
<button onclick="showAll()">📋 نشون بده</button>
<pre id="allKeys">...</pre>

<h3>مقدار یه کلید خاص:</h3>
<input id="keyInput" placeholder="مثلاً: periods یا e_p_123" style="padding:6px;width:200px;border-radius:6px;border:1px solid #ccc">
<button onclick="showKey()">🔍 بخون</button>
<pre id="keyVal">...</pre>

<script>
const SB_URL='https://hrjgokonpyunhxlpbhqv.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhyamdva29ucHl1bmh4bHBiaHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MTM2MzUsImV4cCI6MjA5Mzk4OTYzNX0.vvy9g2kbYEFkNYHwWgi-xf3xQBeMYVcZOYRKGjMFUl8';

async function showAll(){
  document.getElementById('allKeys').textContent='در حال دریافت...';
  try{
    const r=await fetch(`${SB_URL}/rest/v1/kv_store?farm=eq.FARM2020&select=key,updated_at&order=updated_at.desc`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    const d=await r.json();
    if(!d.length){document.getElementById('allKeys').textContent='هیچ ردیفی پیدا نشد!';return;}
    document.getElementById('allKeys').textContent=d.map(x=>`${x.key} — ${x.updated_at?.slice(0,19)||''}`).join('\n');
  }catch(e){document.getElementById('allKeys').textContent='خطا: '+e.message;}
}

async function showKey(){
  const k=document.getElementById('keyInput').value.trim();
  if(!k)return;
  document.getElementById('keyVal').textContent='در حال دریافت...';
  try{
    const r=await fetch(`${SB_URL}/rest/v1/kv_store?farm=eq.FARM2020&key=eq.${k}&select=value,updated_at`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    });
    const d=await r.json();
    if(!d.length){document.getElementById('keyVal').textContent='ردیفی پیدا نشد!';return;}
    document.getElementById('keyVal').textContent=JSON.stringify(d[0],null,2);
  }catch(e){document.getElementById('keyVal').textContent='خطا: '+e.message;}
}
</script>
</body></html>
