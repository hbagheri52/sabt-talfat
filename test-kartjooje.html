<style>
  body{ font-family: Tahoma, sans-serif; padding:16px; background:#f0f4f0; }
  button{ font-size:16px; padding:12px 20px; background:#1a6b3c; color:#fff; border:none; border-radius:8px; width:100%; margin-bottom:12px; }
  pre{ background:#fff; border:1px solid #ccc; border-radius:8px; padding:12px; white-space:pre-wrap; word-break:break-all; font-size:13px; }

</style>
</head>
<body>
<h2>تستِ مستقیمِ Workerِ کارت‌جوجه/تلفات</h2>
<button onclick="runTest('kartjooje')">🔍 تستِ بات کارت‌جوجه</button>
<button onclick="runTest('talfat')">🔍 تستِ بات تلفات</button>
<div class="label">نتیجه:</div>
<pre id="out">هنوز تست نشده...</pre>

<script>
const KJ_PROXY_URL = 'https://kartjooje-telegram-proxy.hoseinbagheri99.workers.dev';
const KJ_PROXY_SECRET = 'NT0z28W7giGwTQBIxuzLQx8QjdpG4YkH5tgUC5s6p_I';
const TG_CHAT = '124757927';

async function runTest(bot){
  const out = document.getElementById('out');
  out.textContent = `در حال تستِ بات "${bot}"...`;
  try{
    const fd = new FormData();
    fd.append('chat_id', TG_CHAT);
    fd.append('text', `✅ پیامِ تستی از test-kartjooje.html برای بات ${bot}`);
    const res = await fetch(`${KJ_PROXY_URL}/?method=sendMessage&bot=${bot}&secret=${encodeURIComponent(KJ_PROXY_SECRET)}`, {
      method: 'POST',
      body: fd,
    });
    const text = await res.text();
    out.textContent = `بات: ${bot}\nHTTP Status: ${res.status}\n\nپاسخ:\n${text}`;
  }catch(e){
    out.textContent = `بات: ${bot}\n❌ خطا:\n${e.name}: ${e.message}\n\n${e.stack || ''}`;
  }
}
</script>
</body>
