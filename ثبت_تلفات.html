function toPersian(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}

// تاریخ امروز
function todayStr(){
  const now=new Date();
  // تبدیل ساده به شمسی
  const jd=gregorianToJalali(now.getFullYear(),now.getMonth()+1,now.getDate());
  return `${jd[0]}/${String(jd[1]).padStart(2,'0')}/${String(jd[2]).padStart(2,'0')}`;
}

function gregorianToJalali(gy,gm,gd){
  const g_d_no=[0,31,(gy%4==0&&gy%100!=0||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31];
  let jy,jm,jd,g_y=gy-1600,g_m=gm-1,g_d=gd-1;
  let g_d_no2=365*g_y+(Math.floor((g_y+3)/4)-Math.floor((g_y+99)/100)+Math.floor((g_y+399)/400));
  for(let i=0;i<g_m;i++)g_d_no2+=g_d_no[i+1];g_d_no2+=g_d;
  let j_d_no=g_d_no2-79;
  let j_np=Math.floor(j_d_no/12053);j_d_no%=12053;
  jy=979+33*j_np+4*Math.floor(j_d_no/1461);j_d_no%=1461;
  if(j_d_no>=366){jy+=Math.floor((j_d_no-1)/365);j_d_no=(j_d_no-1)%365;}
  const j_days=[0,31,31,31,31,31,31,30,30,30,30,30,29];
  for(jm=0;jm<12&&j_d_no>=j_days[jm+1];jm++)j_d_no-=j_days[jm+1];
  jm++;jd=j_d_no+1;
  return[jy,jm,jd];
}

function jalaliToGregorian(jy,jm,jd){
  let gy,gm,gd;
  jy+=1595;
  let days=-355779.0+(365+(jy%33<9?((jy%33)+1)%2==0?1:0:0))*Math.floor(jy/33)+Math.floor((jy%33*8+29)/21)+jd;
  for(let i=0;i<jm-1;i++)days+=i<6?31:30;
  gy=400*Math.floor(days/146097);days%=146097;
  if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++;}
  gy+=4*Math.floor(days/1461);days%=1461;
  if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365;}
  gd=days+1;
  const months=[0,31,29,31,30,31,30,31,31,30,31,30,31];
  if((gy%4==0&&gy%100!=0)||gy%400==0)months[2]=29;else months[2]=28;
  for(gm=0;gm<months.length&&gd>months[gm];gm++)gd-=months[gm];
  return[gy,gm,gd];
}

async function cfGet(k){
  const urls=[
    `${CF_URL}/rest/v1/kv_store?farm=eq.${FARM}&key=eq.${k}&select=value`,
    `${SB_URL}/rest/v1/kv_store?farm=eq.${FARM}&key=eq.${k}&select=value`
  ];
  for(const url of urls){
    try{
      const r=await fetch(url,{
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
        signal:AbortSignal.timeout(8000)
      });
      if(!r.ok)continue;
      const d=await r.json();
      if(!d||!d.length)continue;
      const val=d[0].value;
      return typeof val==='string'?JSON.parse(val):val;
    }catch{}
  }
  return null;
}

// جستجوی periods بدون دونستن farm
async function findPeriodByCode(code){
  try{
    const r=await fetch(`${CF_URL}/rest/v1/kv_store?key=eq.periods&select=value,farm`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
      signal:AbortSignal.timeout(8000)
    });
    const rows=await r.json();
    if(!rows||!rows.length)return null;
    for(const row of rows){
      try{
        const periods=JSON.parse(row.value);
        const p=periods.find(x=>
          (x.code&&x.code.toUpperCase()===code)||
          (x.name&&x.name.toUpperCase()===code)||
          (x.id&&x.id.toUpperCase()===code)
        );
        if(p)return{period:p,farm:row.farm};
      }catch{}
    }
  }catch{}
  return null;
}

async function cfSet(k,v){
  const urls=[
    `${CF_URL}/rest/v1/kv_store`,
    `${SB_URL}/rest/v1/kv_store`
  ];
  for(const url of urls){
    try{
      const r=await fetch(url,{
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify({farm:FARM,key:k,value:JSON.stringify(v)}),
        signal:AbortSignal.timeout(8000)
      });
      if(r.ok||r.status===201||r.status===200||r.status===409)return true;
    }catch{}
  }
  return false;
}

  }
  const total=nightTotal+dayTotal;
  
  if(total===0){toast('⚠️ هیچ تلفاتی وارد نشده');return;}
  
  toast('📤 در حال ارسال...');
  
  // خواندن ثبت‌های روزانه از کارت جوجه
  const entries=await cfGet(`e_${PERIOD_ID}`)||[];
  const today=TARGET_DATE||todayStr();
  
  // پیدا کردن ثبت امروز
  const idx=entries.findIndex(e=>e.date===today);
  
  if(idx>=0){
    // آپدیت ثبت موجود
    const feedVal2=+document.getElementById('feedInput').value||0;
    entries[idx].totalD=nightTotal;
    entries[idx].totalAll=total;
    entries[idx].totalCull=cullTotal;
    entries[idx].hallNight=hallNight;
    entries[idx].hallDay=hallDay;
    entries[idx].cull=hallCull;
    entries[idx].d=hallNight.map((n,j)=>n+hallDay[j]);
    entries[idx].hallDead=hallNight.map((n,j)=>n+hallDay[j]);
    if(feedVal2>0)entries[idx].feed=feedVal2;
  } else {
    // ثبت جدید
    const periods=await cfGet('periods')||[];
    const p=periods.find(x=>x.id===PERIOD_ID);
    let age=1;
    if(p&&p.date){
      // محاسبه دقیق سن با تبدیل به میلادی
      const sp=p.date.split('/').map(Number);
      const tp=today.split('/').map(Number);
      const startG=jalaliToGregorian(sp[0],sp[1],sp[2]);
      const todayG=jalaliToGregorian(tp[0],tp[1],tp[2]);
      const diff=Math.round((new Date(todayG[0],todayG[1]-1,todayG[2])-new Date(startG[0],startG[1]-1,startG[2]))/(86400000));
      age=diff+1;
    }
    const dayNameCalc=(()=>{try{const tp=today.split('/').map(Number);const tg=jalaliToGregorian(tp[0],tp[1],tp[2]);return WD[new Date(tg[0],tg[1]-1,tg[2]).getDay()];}catch{return '';}})();
    const feedVal=+document.getElementById('feedInput').value||0;
    entries.push({
      id:'e_'+Date.now(),
      date:today,
      dayName:dayNameCalc,
      age,
      totalD:nightTotal,
      totalAll:total,
      cull:hallCull,
      totalCull:cullTotal,
      hallNight:hallNight,
      hallDay:hallDay,
      d:hallNight.map((n,j)=>n+hallDay[j]),
      hallDead:hallNight.map((n,j)=>n+hallDay[j]),
      feed:feedVal,
      water:0,temp:0,
      _fromWorker:true
    });
  }
  
  const ok=await cfSet(`e_${PERIOD_ID}`,entries);
  if(ok){
    toast('✅ ارسال شد!',3000);
    clearAll();
  } else {
    toast('⚠️ خطا در ارسال');
  }
}

async function loadHistory(){
  const el=document.getElementById('historyList');
  el.innerHTML='<div style="text-align:center;color:#999;font-size:13px;padding:12px">⏳ در حال بارگذاری...</div>';
  const entries=await cfGet(`e_${PERIOD_ID}`)||[];
  // فقط ثبت‌هایی که از این اپ ارسال شده یا دارای تلفات هستن
  const filtered=entries.filter(e=>e.totalAll>0||e._fromWorker).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
  if(!filtered.length){el.innerHTML='<div style="text-align:center;color:#999;font-size:13px;padding:12px">سابقه‌ای وجود ندارد</div>';return;}
  el.innerHTML=filtered.map(e=>`
    <div style="border:1px solid #e0e0e0;border-radius:10px;padding:10px;margin-bottom:8px;background:#fafafa">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-weight:800;font-size:13px;color:#1b5e20">${e.date} — ${e.dayName||''}</span>
        <div style="display:flex;gap:6px">
          <button onclick="editEntry('${e.id}')" style="background:#e3f2fd;border:1px solid #1565c0;border-radius:6px;padding:3px 8px;font-size:11px;color:#1565c0;cursor:pointer">✏️ ویرایش</button>
          <button onclick="deleteEntry('${e.id}')" style="background:#ffebee;border:1px solid #c62828;border-radius:6px;padding:3px 8px;font-size:11px;color:#c62828;cursor:pointer">🗑️ حذف</button>
        </div>
      </div>
      <div style="font-size:12px;color:#555">
        تلفات کل: <b>${e.totalAll||0}</b> قطعه
        ${e.hallDead?` | سالن‌ها: ${e.hallDead.join('، ')}`:''}
      </div>
    </div>
  `).join('');
}

async function deleteEntry(id){
  if(!confirm('این ثبت حذف شود؟'))return;
  const entries=await cfGet(`e_${PERIOD_ID}`)||[];
  const newEntries=entries.filter(e=>e.id!==id);
  const ok=await cfSet(`e_${PERIOD_ID}`,newEntries);
  if(ok){toast('✅ حذف شد');loadHistory();}
  else toast('⚠️ خطا در حذف');
}

async function editEntry(id){
  const entries=await cfGet(`e_${PERIOD_ID}`)||[];
  const e=entries.find(x=>x.id===id);
  if(!e){toast('⚠️ پیدا نشد');return;}
  TARGET_DATE=e.date;
  document.getElementById('dateLabel').textContent=`تاریخ ثبت: ${e.dayName||''} ${e.date}`;
  document.getElementById('hdrDate').textContent=`${e.dayName||''} ${e.date}`;
  // پر کردن فیلدها - تلفات شب
  if(e.hallNight){
    e.hallNight.forEach((v,i)=>{const el=document.getElementById('n'+(i+1));if(el)el.value=v||0;});
  } else if(e.hallDead){
    // داده قدیمی - نصف به شب نصف به روز
    e.hallDead.forEach((v,i)=>{
      const n=document.getElementById('n'+(i+1));
      if(n)n.value=v||0;
    });
  }
  // تلفات روز
  if(e.hallDay){
    e.hallDay.forEach((v,i)=>{const el=document.getElementById('d'+(i+1));if(el)el.value=v||0;});
  }
  // سربریده
  if(e.cull){
    e.cull.forEach((v,i)=>{const el=document.getElementById('c'+(i+1));if(el)el.value=v||0;});
  }
  calcTotals();
  window.scrollTo(0,0);
  toast('✅ مقادیر را ویرایش کنید و ارسال بزنید');
}

function clearAll(){
  for(let i=1;i<=6;i++){
    document.getElementById('n'+i).value='';
    document.getElementById('d'+i).value='';
    document.getElementById('c'+i).value='';
  }
  calcTotals();
}

// ساخت سالن‌ها
buildHalls('nightHalls','n');
buildHalls('dayHalls','d');
buildHalls('cullHalls','c');
calcTotals();
</script>
