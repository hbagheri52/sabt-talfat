<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Vazirmatn',sans-serif;background:#f0f4f0;min-height:100vh;direction:rtl;}
.hdr{background:linear-gradient(135deg,#0a3d0a,#1b5e20,#2e7d32);color:#fff;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 3px 12px rgba(0,0,0,.3);}
.hdr-title{font-size:16px;font-weight:900;color:#ffd54f;}
.hdr-sub{font-size:10px;color:#fff;font-weight:800;}
.container{padding:8px;max-width:480px;margin:0 auto;}
.card{background:#fff;border-radius:10px;padding:8px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.card-title{font-size:12px;font-weight:800;color:#1b5e20;margin-bottom:6px;border-bottom:1.5px solid #e8f5e9;padding-bottom:5px;}
.halls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;}
.hall-box{background:#f9fbe7;border:1px solid #c5e1a5;border-radius:8px;padding:6px;}
.hall-name{font-size:11px;font-weight:800;color:#33691e;margin-bottom:4px;text-align:center;}
.hall-row{display:flex;flex-direction:column;gap:2px;}
.hall-row label{font-size:9px;color:#666;text-align:center;}
.hall-row input{border:1px solid #ddd;border-radius:6px;padding:5px 3px;font-family:'Vazirmatn',sans-serif;font-size:13px;text-align:center;outline:none;width:100%;}
.hall-row input:focus{border-color:#2e7d32;}
.total-box{background:#e8f5e9;border-radius:8px;padding:5px 10px;display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
.total-label{font-size:10px;color:#555;}
.total-val{font-size:14px;font-weight:900;color:#1b5e20;}
.btn{width:100%;padding:10px;border:none;border-radius:10px;font-family:'Vazirmatn',sans-serif;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s;}
.btn-green{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;box-shadow:0 3px 8px rgba(46,125,50,.3);}
.btn-green:active{transform:scale(.98);}
.btn-outline{background:#fff;color:#2e7d32;border:2px solid #2e7d32;margin-top:6px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;z-index:999;display:none;}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.login-logo{font-size:48px;margin-bottom:16px;}
.login-title{font-size:24px;font-weight:900;color:#1b5e20;margin-bottom:8px;}
.login-sub{font-size:13px;color:#777;margin-bottom:32px;text-align:center;}
.login-input{width:100%;max-width:320px;border:2px solid #ddd;border-radius:12px;padding:14px;font-family:'Vazirmatn',sans-serif;font-size:18px;text-align:center;outline:none;margin-bottom:12px;}
.login-input:focus{border-color:#2e7d32;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
.badge-night{background:#1a237e;color:#fff;}
.badge-day{background:#f57f17;color:#fff;}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:13px;}
.summary-row:last-child{border:none;font-weight:800;color:#1b5e20;}
#mainApp{display:none;}.cl-modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:16px;}
.cl-modal-bg.show{display:flex;}
.cl-modal{background:#fff;border-radius:14px;padding:16px;max-width:440px;width:100%;max-height:80vh;overflow-y:auto;}
</style>

<body>

<!-- صفحه ورود -->
<div class="login-screen" id="loginScreen">
  <div class="login-logo">🐔</div>
  <div class="login-title">ثبت تلفات</div>
  <div class="login-sub">کد دوره را وارد کنید</div>
  <input class="login-input" id="codeInput" placeholder="کد دوره (مثلاً 120-405)" oninput="this.value=this.value.toUpperCase()">
  <button class="btn btn-green" style="max-width:320px;width:100%" onclick="doLogin()">ورود 🔑</button>
</div>


<!-- صفحه انتخاب شیفت -->
<div class="login-screen" id="shiftScreen" style="display:none">
  <div class="login-logo">🐔</div>
  <div class="login-title" id="shiftPeriodName"></div>
  <div class="login-sub">شیفت خود را انتخاب کنید</div>
  <div style="display:flex;gap:16px;margin-top:8px">
    <button onclick="selectShift('day')" style="flex:1;padding:20px 10px;border:none;border-radius:16px;background:linear-gradient(135deg,#f57f17,#ffa000);color:#fff;font-family:Vazirmatn,sans-serif;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(245,127,23,.4)">☀️<br>روز</button>
    <button onclick="selectShift('night')" style="flex:1;padding:20px 10px;border:none;border-radius:16px;background:linear-gradient(135deg,#1a237e,#283593);color:#fff;font-family:Vazirmatn,sans-serif;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(26,35,126,.4)">🌙<br>شب</button>
  </div>
</div>

<!-- اپ اصلی -->
<div id="mainApp">
  <div class="hdr">
    <div>
      <div class="hdr-title">🐔 ثبت تلفات</div>
      <div class="hdr-sub" id="hdrSub">دوره: —</div>
    </div>
    <div style="text-align:left">
      <div style="font-size:11px;color:#ffd54f;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5)" id="hdrDate"></div>
      <div style="font-size:10px;color:#fff;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.5)" id="hdrToday"></div>
      <button onclick="doLogout()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer;margin-top:4px">خروج</button>
      <button onclick="showChangeLog()" style="background:rgba(255,255,255,.2);border:none;color:#fff;font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer;margin-top:4px;margin-right:4px">🕒 سابقه</button>
    </div>
  </div>

  <div class="container">
    <div style="background:#e8f5e9;border-radius:12px;padding:10px 14px;margin-bottom:12px;text-align:center;font-weight:800;color:#1b5e20;font-size:14px" id="dateLabel">در حال بررسی...</div>
    <!-- تلفات روز -->
    <div id="daySection" class="card">
      <div class="card-title">☀️ تلفات روز <span class="badge badge-day">روز</span></div>
      <div class="halls" id="dayHalls"></div>
      <div class="total-box">
        <div class="total-label">جمع تلفات روز:</div>
        <div class="total-val" id="dayTotal">۰</div>
      </div>
    </div>

    <!-- تلفات شب -->
    <div id="nightSection" class="card">
      <div class="card-title">🌙 تلفات شب <span class="badge badge-night">شب</span></div>
      <div class="halls" id="nightHalls"></div>
      <div class="total-box">
        <div class="total-label">جمع تلفات شب:</div>
        <div class="total-val" id="nightTotal">۰</div>
      </div>
    </div>

    <!-- سربریده -->
    <div id="cullSection" class="card">
      <div class="card-title">🔪 سربریده <span class="badge" style="background:#c62828;color:#fff">سربریده</span></div>
      <div class="halls" id="cullHalls"></div>
      <div class="total-box">
        <div class="total-label">جمع سربریده:</div>
        <div class="total-val" id="cullTotal">۰</div>
      </div>
    </div>

    <!-- دان -->
    <div id="feedSection" class="card">
      <div class="card-title">🌾 دان مصرفی (کیلوگرم) </div>
      <input type="number" id="feedInput" min="0" placeholder="0" oninput="calcTotals()" style="width:100%;border:1.5px solid #ddd;border-radius:10px;padding:10px;font-family:Vazirmatn,sans-serif;font-size:16px;text-align:center;outline:none;">
    </div>

    <!-- جمع کل -->
    <div class="card">
      <div class="card-title">📊 خلاصه امروز</div>
      <div id="summaryRows"></div>
    </div>

    <button class="btn btn-green" id="sendBtn" onclick="sendToKart()">📤 ارسال به کارت جوجه</button>
    <button class="btn btn-outline" onclick="clearAll()">🔄 پاک کردن</button>
    <button class="btn" id="cancelEditBtn" style="display:none;background:#c62828;color:#fff;margin-top:8px" onclick="cancelEditMode()">↩️ لغو ویرایش، برگرد به تاریخ امروز</button>

    <!-- سابقه ثبت‌ها -->
    <div class="card" style="margin-top:14px">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
        <span id="historyTitle">📋 سابقه ثبت‌ها</span>
        <button onclick="localStorage.removeItem(`e_${PERIOD_ID}`);loadHistory(true)" style="background:#e8f5e9;border:1.5px solid #2e7d32;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700;color:#1b5e20;cursor:pointer">🔄 بارگذاری</button>
      </div>
      <div id="historyList"><div style="text-align:center;color:#999;font-size:13px;padding:12px">برای مشاهده سابقه کلیک کنید</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="cl-modal-bg" id="clModalBg"><div class="cl-modal" id="clModalBody"></div></div>

    .replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)) // ارقام فارسی
    .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)) // ارقام عربی
    .replace(/[\u2010-\u2015\u2212ـ]/g,'-') // انواع خط‌تیره/زیرکش شبیه به هم
    .replace(/\s+/g,'');
}

function todayStr(){
  const now=new Date();
  // تبدیل ساده به شمسی
  const jd=gregorianToJalali(now.getFullYear(),now.getMonth()+1,now.getDate());
  return `${jd[0]}/${String(jd[1]).padStart(2,'0')}/${String(jd[2]).padStart(2,'0')}`;
}

function gregorianToJalali(gy,gm,gd){
  const g_d_no=[0,31,(gy%4==0&&gy%100!=0||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31];
  let jy,jm,jd,g_y=gy-1600,g_m=gm-1,g_d=gd-1;
  let g_d_no2=365*g_y+(Math.floor((g_y+3)/4)-Math.floor((g_y+99)/100)+Math.floor((g_y+399)/400));
  for(let i=0;i<g_m;i++)g_d_no2+=g_d_no[i+1];g_d_no2+=g_d;
  let j_d_no=g_d_no2-79;
  let j_np=Math.floor(j_d_no/12053);j_d_no%=12053;
  jy=979+33*j_np+4*Math.floor(j_d_no/1461);j_d_no%=1461;
  if(j_d_no>=366){jy+=Math.floor((j_d_no-1)/365);j_d_no=(j_d_no-1)%365;}
  const j_days=[0,31,31,31,31,31,31,30,30,30,30,30,29];
  for(jm=0;jm<12&&j_d_no>=j_days[jm+1];jm++)j_d_no-=j_days[jm+1];
  jm++;jd=j_d_no+1;
  return[jy,jm,jd];
}

const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];

async function setUnregisteredDate(periodId,preloadedEntries){
  // تاریخ امروز واقعی
  const todayReal=new Date();
  const jdToday=gregorianToJalali(todayReal.getFullYear(),todayReal.getMonth()+1,todayReal.getDate());
  const todayRealStr=`${jdToday[0]}/${String(jdToday[1]).padStart(2,'0')}/${String(jdToday[2]).padStart(2,'0')}`;
  const el=document.getElementById('hdrToday');
  if(el) el.textContent=`امروز: ${WD[todayReal.getDay()]} ${todayRealStr}`;

  // مقدار پیش‌فرض اولیه: امروز (تا وقتی محاسبه دقیق انجام شود)
  TARGET_DATE=todayRealStr;
  document.getElementById('hdrDate').innerHTML=`<span style='color:#ffd54f;font-weight:900;font-size:13px'>${WD[todayReal.getDay()]} ${todayRealStr}</span>`;
  document.getElementById('dateLabel').textContent=`تاریخ ثبت: ${WD[todayReal.getDay()]} ${todayRealStr}`;
  document.getElementById('dateLabel').style.background='#e8f5e9';
  document.getElementById('dateLabel').style.color='#1b5e20';
  document.getElementById('dateLabel').style.border='none';

  try{
    // مهم: همیشه تازه از سرور بخون، نه کش گوشی — این محاسبه تعیین می‌کند کدوم تاریخ باید الان ثبت بشه
    // اگه روی داده‌ی قدیمیِ کش حساب شه، ممکنه به‌اشتباه یه روز ناقص رو «کامل» در نظر بگیره
    // و در نتیجه داده برای روز اشتباه (مثلاً یک روز جلوتر) ثبت بشه
    const _raw=preloadedEntries||(await cfGetFresh(`e_${periodId}`));
    const entries=(_raw==='NOT_FOUND'||_raw===null)?[]:_raw;
    // فقط entryهایی که برای همین شیفت کامل ثبت شدن
    const doneDates=entries.filter(e=>{
      // یه entry فقط وقتی «قدیمیِ بدون فلگ» حساب می‌شه که واقعاً داده‌ی تلفات هم داشته باشه —
      // وگرنه entryهایی که فقط اپِ آب ساخته (بدون هیچ داده‌ی تلفاتی) اشتباهاً «کامل» حساب می‌شدن
      const hasMortData=Array.isArray(e.hallDay)||Array.isArray(e.hallNight)||(Array.isArray(e.d)&&e.d.length>0)||(e.totalAll>0);
      const isLegacy=(!e._dayDone&&!e._nightDone)&&hasMortData;
      if(isLegacy) return true;
      if(SHIFT==='night') return e._nightDone===true||(e.totalNight!=null&&e.totalNight>0&&e.hallNight!=null);
      if(SHIFT==='day') return e._dayDone===true||(e.totalDay!=null&&e.totalDay>0&&e.hallDay!=null);
      return e.totalAll>0;
    }).map(e=>e.date);

    if(!doneDates.length){
      // هیچ ثبتی نشده — تاریخ شروع دوره را نشون بده
      if(PERIOD_START){
        const sp=PERIOD_START.split('/').map(Number);
        const sg=jalaliToGregorian(sp[0],sp[1],sp[2]);
        const sDate=new Date(sg[0],sg[1]-1,sg[2]);
        applyTargetDate(PERIOD_START,WD[sDate.getDay()],0);
      }
      return;
    }

    // اسکن روز به روز از ابتدای دوره تا امروز، برای پیدا کردن اولین "روز ثبت‌نشده" (gap)
    const doneSet=new Set(doneDates);
    let cursorG=null;
    if(PERIOD_START){
      const sp=PERIOD_START.split('/').map(Number);
      const sg=jalaliToGregorian(sp[0],sp[1],sp[2]);
      cursorG=new Date(sg[0],sg[1]-1,sg[2]);
    }else{
      // اگر شروع دوره نامعلوم بود، از قدیمی‌ترین تاریخ ثبت‌شده شروع کن
      let oldestG=null;
      for(const ds of doneDates){
        const p=ds.split('/').map(Number);
        const g=jalaliToGregorian(p[0],p[1],p[2]);
        const gd=new Date(g[0],g[1]-1,g[2]);
        if(!oldestG||gd<oldestG)oldestG=gd;
      }
      cursorG=oldestG;
    }

    const todayG0=new Date(todayReal.getFullYear(),todayReal.getMonth(),todayReal.getDate());
    let foundGap=null;
    let safety=0;
    while(cursorG&&cursorG<=todayG0&&safety<730){
      safety++;
      const cj=gregorianToJalali(cursorG.getFullYear(),cursorG.getMonth()+1,cursorG.getDate());
      const cStr=`${cj[0]}/${String(cj[1]).padStart(2,'0')}/${String(cj[2]).padStart(2,'0')}`;
      if(!doneSet.has(cStr)){foundGap={dateStr:cStr,g:new Date(cursorG)};break;}
      cursorG.setDate(cursorG.getDate()+1);
    }

    if(foundGap){
      applyTargetDate(foundGap.dateStr,WD[foundGap.g.getDay()],foundGap.g);
    }else{
      // همه روزها تا امروز ثبت شدن — مثل قبل برو سراغ روز بعد از جدیدترین ثبت
      let latestG=null;
      for(const ds of doneDates){
        const p=ds.split('/').map(Number);
        const g=jalaliToGregorian(p[0],p[1],p[2]);
        const gd=new Date(g[0],g[1]-1,g[2]);
        if(!latestG||gd>latestG)latestG=gd;
      }
      const nextG=new Date(latestG);
      nextG.setDate(nextG.getDate()+1);
      const nj=gregorianToJalali(nextG.getFullYear(),nextG.getMonth()+1,nextG.getDate());
      const nextDateStr=`${nj[0]}/${String(nj[1]).padStart(2,'0')}/${String(nj[2]).padStart(2,'0')}`;
      applyTargetDate(nextDateStr,WD[nextG.getDay()],nextG);
    }
  }catch(e){console.error('setUnregisteredDate:',e);}
}

function applyTargetDate(dateStr,dayName,gregDateObj){
  TARGET_DATE=dateStr;
  let ageCalc='';
  if(PERIOD_START&&gregDateObj){
    try{
      const sp=PERIOD_START.split('/').map(Number);
      const sg=jalaliToGregorian(sp[0],sp[1],sp[2]);
      const diff=Math.round((gregDateObj-new Date(sg[0],sg[1]-1,sg[2]))/86400000);
      ageCalc=` — روز ${diff+1}`;
    }catch{}
  }
  document.getElementById('hdrDate').textContent=`${dayName} ${dateStr}${ageCalc}`;
  document.getElementById('dateLabel').textContent=`تاریخ ثبت: ${dayName} ${dateStr}${ageCalc}`;
  document.getElementById('dateLabel').style.background='#e8f5e9';
  document.getElementById('dateLabel').style.color='#1b5e20';
  document.getElementById('dateLabel').style.border='none';
  const sbA=document.getElementById('sendBtn');if(sbA)sbA.textContent='📤 ارسال به کارت جوجه';
  const cbA=document.getElementById('cancelEditBtn');if(cbA)cbA.style.display='none';
}

function jalaliToGregorian(jy, jm, jd) {
  jy = jy - 979;
  jm = jm - 1;
  jd = jd - 1;
  let jDayNo = 365 * jy + Math.floor(jy / 33) * 8 + Math.floor(((jy % 33) + 3) / 4);
  const jDaysInMonth=[31,31,31,31,31,31,30,30,30,30,30,29];
  for (let i = 0; i < jm; ++i) jDayNo += jDaysInMonth[i];
  jDayNo += jd;
  let gDayNo = jDayNo + 79;
  let gy = 1600 + 400 * Math.floor(gDayNo / 146097);
  gDayNo = gDayNo % 146097;
  let leap = true;
  if (gDayNo >= 36525) {
    gDayNo--;
    gy += 100 * Math.floor(gDayNo / 36524);
    gDayNo = gDayNo % 36524;
    if (gDayNo >= 365) gDayNo++; else leap = false;
  }
  gy += 4 * Math.floor(gDayNo / 1461);
  gDayNo %= 1461;
  if (gDayNo >= 366) {
    leap = false;
    gDayNo--;
    gy += Math.floor(gDayNo / 365);
    gDayNo = gDayNo % 365;
  }
  const gDaysInMonth = [31, (leap ? 29 : 28), 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm = 0;
  while (gm < 12 && gDayNo >= gDaysInMonth[gm]) { gDayNo -= gDaysInMonth[gm]; gm++; }
  return [gy, gm + 1, gDayNo + 1];
}

// ━━━ خواندن از سرور — کش را نادیده می‌گیره ━━━
// اول Firebase (پایدارتر)، بعد پراکسی Cloudflare Worker، و اگه جواب نداد یا خالی برگردوند، به Supabase مستقیم برمی‌گرده
async function cfGetFresh(k){
  const urls=[
    `${CF_URL}/rest/v1/kv_store?farm=eq.${FARM}&key=eq.${k}&select=value,updated_at&order=updated_at.desc&limit=1`,
    `${SB_URL}/rest/v1/kv_store?farm=eq.${FARM}&key=eq.${k}&select=value,updated_at&order=updated_at.desc&limit=1`
  ];
  // Firebase و Worker/Supabase رو هم‌زمان می‌خونیم، بعد هر کدوم واقعاً تازه‌تر بود (بر اساس updated_at) رو انتخاب می‌کنیم —
  // نه صرفاً هر کدوم اول جواب داد، چون ممکنه یکی نسخه‌ی عقب‌مونده داشته باشه و داده‌ی جدیدتر رو گم کنیم
  const fbPromise=fbGet(k);
  const sbPromise=Promise.allSettled(urls.map(async url=>{
    const r=await fetch(url,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
      cache:'no-store',
      signal:AbortSignal.timeout(4000)
    });
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    if(!d||!d.length)return{empty:true};
    const val=d[0].value;
    return{value:typeof val==='string'?JSON.parse(val):val,updatedAt:d[0].updated_at||null};
  }));
  const [fb,sbAttempts]=await Promise.all([fbPromise,sbPromise]);
  let sb=null,sawOkEmpty=false,lastErr=null;
  for(const a of sbAttempts){
    if(a.status==='fulfilled'){
      if(a.value.empty){sawOkEmpty=true;continue;}
      sb=a.value;break;
    }else{
      lastErr=a.reason&&a.reason.message?a.reason.message:String(a.reason);
    }
  }
  let winner=null;
  if(fb&&sb){
    winner=(new Date(fb.updatedAt||0).getTime()>=new Date(sb.updatedAt||0).getTime())?fb:sb;
  }else{
    winner=fb||sb;
  }
  if(winner){
    try{localStorage.setItem(k,JSON.stringify(winner.value));}catch{}
    return winner.value;
  }
  if(sawOkEmpty){cfGetFresh.lastError='not_found';return 'NOT_FOUND';}
  cfGetFresh.lastError=lastErr||'unknown';
  return null;
}

async function cfGet(k){
  try{
    const cached=localStorage.getItem(k);
    if(cached){const v=JSON.parse(cached);if(v!==null&&v!==undefined)return v;}
  }catch{}
  const res=await cfGetFresh(k);
  return res==='NOT_FOUND'?null:res;
}

// جستجوی periods بدون دونستن farm — اول Worker بعد Supabase مستقیم رو امتحان می‌کنه
async function findPeriodByCode(code){
  const urls=[
    `${CF_URL}/rest/v1/kv_store?key=eq.periods&select=value,farm`,
    `${SB_URL}/rest/v1/kv_store?key=eq.periods&select=value,farm`
  ];
  for(const url of urls){
    try{
      const r=await fetch(url,{
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
        cache:'no-store',
        signal:AbortSignal.timeout(8000)
      });
      if(!r.ok)continue;
      const rows=await r.json();
      if(!rows||!rows.length)continue;
      for(const row of rows){
        try{
          const val=row.value;
          const periods=typeof val==='string'?JSON.parse(val):val;
          const p=periods.find(x=>
            (x.code&&x.code.toUpperCase()===code)||
            (x.name&&x.name.toUpperCase()===code)||
            (x.id&&x.id.toUpperCase()===code)
          );
          if(p)return{period:p,farm:row.farm};
        }catch{}
      }
    }catch{}
  }
  return null;
}

// نوشتن روی سرور — همزمان روی Worker و Supabase مستقیم می‌نویسه (مثل sbSet توی کارت_جوجه.html)
// تا اگه یکی موقع خوندن بعدی کند/قطع بود، اون یکی داده رو داشته باشه
async function cfSetOne(baseUrl,k,v){
  try{
    const r=await fetch(`${baseUrl}/rest/v1/kv_store`,{
      method:'POST',
      headers:{
        'apikey':SB_KEY,
        'Authorization':'Bearer '+SB_KEY,
        'Content-Type':'application/json',
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body:JSON.stringify({farm:FARM,key:k,value:v,updated_at:new Date().toISOString()}),
      signal:AbortSignal.timeout(10000)
    });
    if(r.status===409){
      const r2=await fetch(`${baseUrl}/rest/v1/kv_store?farm=eq.${FARM}&key=eq.${k}`,{
        method:'PATCH',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
        body:JSON.stringify({value:v,updated_at:new Date().toISOString()}),
        signal:AbortSignal.timeout(10000)
      });
      return r2.ok||r2.status===204;
    }
    if(!r.ok){
      let errBody='';try{errBody=await r.text();}catch{}
      console.error(`cfSet upsert failed [${baseUrl}]: HTTP ${r.status} | farm=${FARM} key=${k} | ${errBody}`);
      return false;
    }
    return r.ok||r.status===204;
  }catch(e){
    console.error(`cfSet network error [${baseUrl}]:`,e);
    return false;
  }
}
// به محضِ اولین موفقیت (هر کدوم زودتر جواب داد) resolve می‌شه؛ بقیه در پس‌زمینه ادامه پیدا می‌کنن
// تا کاربر معطلِ اونایی که ممکنه بدون VPN گیر کنن نمونه
function raceAnySuccess(promises){
  return new Promise(resolve=>{
    let remaining=promises.length,settled=false;
    if(remaining===0){resolve(false);return;}
    promises.forEach(p=>{
      p.then(v=>{
        if(v===true&&!settled){settled=true;resolve(true);}
        remaining--;
        if(remaining===0&&!settled){settled=true;resolve(false);}
      }).catch(()=>{
        remaining--;
        if(remaining===0&&!settled){settled=true;resolve(false);}
      });
    });
  });
}
async function cfSet(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));}catch{}
  const bases=[CF_URL,SB_URL];
  const anyOk=await raceAnySuccess([...bases.map(b=>cfSetOne(b,k,v)),fbSet(k,v)]);
  if(!anyOk){
    toast(`⚠️ ذخیره روی سرور ناموفق بود — فقط روی گوشی ذخیره شد`,7000);
  }
  return anyOk;
}

// بکاپ خودکار قبل از هر ذخیره — چرخش روی ۱۰ اسلات آخر (نه فقط روز هفته)، پس حتی چند ذخیره در یک روز هم جدا نگه داشته می‌شن
const BACKUP_SLOTS=10;
async function backupBeforeSave(key,snapshot){
  try{
    let idx=await cfGet(`${key}_bakIdx`);
    idx=(typeof idx==='number'&&idx>=0)?idx:0;
    await cfSet(`${key}_bak${idx}`,snapshot);
    const nextIdx=(idx+1)%BACKUP_SLOTS;
    await cfSet(`${key}_bakIdx`,nextIdx);
  }catch(e){console.error('backup failed:',e);}
}

// ذخیره امن: قبلش از وضعیت فعلی بکاپ می‌گیره و اگه تعداد رکوردها بیشتر از حد انتظار کم بشه هشدار می‌ده
async function safeSave(key,oldEntries,newEntries,expectedDrop){
  expectedDrop=expectedDrop||0;
  const drop=(oldEntries?oldEntries.length:0)-(newEntries?newEntries.length:0);
  if(drop>expectedDrop){
    const msg=`⚠️ هشدار: تعداد رکوردها از ${oldEntries.length} به ${newEntries.length} کاهش پیدا کرده (${drop} رکورد کمتر از انتظار).\nاین می‌تونه به‌معنی از دست رفتن داده باشه.\n\nمطمئنی می‌خوای ذخیره کنی؟`;
    if(!confirm(msg))return false;
  }
  await backupBeforeSave(key,oldEntries||[]);
  return await cfSet(key,newEntries);
}

async function sendToKart(){
  if(!PERIOD_ID){toast('⚠️ ابتدا وارد شوید');return;}
  
  let nightTotal=0,dayTotal=0,cullTotal=0;
  const hallNight=[],hallDay=[],hallCull=[];
  for(let i=1;i<=6;i++){
    const n=SHIFT==='night'?(+document.getElementById('n'+i).value||0):0;
    const d=SHIFT==='day'?(+document.getElementById('d'+i).value||0):0;
    const c=+document.getElementById('c'+i).value||0;
    hallNight.push(n);hallDay.push(d);hallCull.push(c);
    nightTotal+=n;dayTotal+=d;cullTotal+=c;
  }
  const shiftTotal=nightTotal+dayTotal+cullTotal;
  
  if(shiftTotal===0){toast('⚠️ هیچ تلفاتی وارد نشده');return;}
  
  const today=TARGET_DATE||todayStr();
  const feedVal=SHIFT==='day'?(+document.getElementById('feedInput').value||0):0;

  // یک تلاش کامل: تازه‌خوانی از سرور، اعمال تغییر شیفت، ذخیره
  async function attemptOnce(){
    let freshResult=await cfGetFresh(`e_${PERIOD_ID}`);
    // اگه خطای شبکه بود (null)، یه‌بار دیگه امتحان کن
    if(freshResult===null){
      await new Promise(r=>setTimeout(r,1200));
      freshResult=await cfGetFresh(`e_${PERIOD_ID}`);
    }
    let entries;
    if(freshResult==='NOT_FOUND'){
      // سرور کلید نداره — از کش محلی بخون تا ثبت‌های قبلی از دست نره
      try{const _lc=localStorage.getItem(`e_${PERIOD_ID}`);const _a=_lc?JSON.parse(_lc):null;entries=Array.isArray(_a)?_a:[];}catch{entries=[];}
    } else if(freshResult!==null){
      entries=freshResult;
    }else{
      // مهم: اگه نتونیم آخرین نسخه‌ی واقعی رو از سرور بخونیم، اصلاً ذخیره نمی‌کنیم.
      // قبلاً اینجا به کش قدیمی همین گوشی برمی‌گشتیم و کل آرایه رو با اون بازنویسی می‌کردیم؛
      // همین باعث می‌شد ثبت‌های تازه‌ی گوشی‌های دیگه (که هنوز توی کش این گوشی نبودن) پاک بشن.
      return{ok:false,noConn:true};
    }
    const entriesSnapshot=JSON.parse(JSON.stringify(entries));
    const idx=entries.findIndex(e=>e.date===today);

    if(idx>=0){
      if(SHIFT==='night'){
        entries[idx].hallNight=hallNight;
        entries[idx].totalNight=nightTotal;
        entries[idx]._nightDone=true;
        entries[idx]._nightReg=true;
      } else {
        entries[idx].hallDay=hallDay;
        entries[idx].totalDay=dayTotal;
        entries[idx]._dayDone=true;
        entries[idx].cull=hallCull;
        entries[idx].totalCull=cullTotal;
        entries[idx].totalC=cullTotal;
        if(feedVal>0)entries[idx].feed=feedVal;
      }
      const bothDone=entries[idx]._dayDone===true&&entries[idx]._nightDone===true;
      const hn=entries[idx].hallNight||[0,0,0,0,0,0];
      const hd=entries[idx].hallDay||[0,0,0,0,0,0];
      entries[idx].hallDead=hn.map((n,j)=>n+(hd[j]||0));
      entries[idx].d=entries[idx].hallDead;
      const curCull=entries[idx].totalCull||0;
      if(bothDone){
        entries[idx].totalD=(entries[idx].totalNight||0)+(entries[idx].totalDay||0);
        entries[idx].totalAll=entries[idx].totalD+curCull;
      } else {
        entries[idx].totalD=null;
        entries[idx].totalAll=null;
      }
    } else {
      // محاسبه سن با PERIOD_START (همون متغیر قابل‌اعتمادی که پیام تلگرام هم ازش استفاده می‌کنه)
      // قبلاً اینجا یه fetch جداگانه برای periods می‌زد که اگه لحظه‌ای شکست می‌خورد،
      // سن رو بی‌سروصدا ۱ می‌ذاشت و باعث می‌شد تلفات روز ۵۴ زیر «۱ روزگی» تو کارت ثبت بشه
      let age=1;
      let periodStart=PERIOD_START;
      if(!periodStart){
        let periods=await cfGetFresh('periods');
        if(periods===null){
          try{const lc=localStorage.getItem('periods');periods=lc?JSON.parse(lc):[];}catch{periods=[];}
        }
        if(!Array.isArray(periods))periods=[];
        const p=periods.find(x=>x.id===PERIOD_ID);
        periodStart=p?p.date:'';
      }
      if(periodStart){
        const sp=periodStart.split('/').map(Number);
        const tp=today.split('/').map(Number);
        const startG=jalaliToGregorian(sp[0],sp[1],sp[2]);
        const todayG=jalaliToGregorian(tp[0],tp[1],tp[2]);
        const diff=Math.round((new Date(todayG[0],todayG[1]-1,todayG[2])-new Date(startG[0],startG[1]-1,startG[2]))/(86400000));
        age=diff+1;
      } else {
        // نه PERIOD_START داشتیم نه periods از سرور اومد — به‌جای سن اشتباه (۱)، اصلاً ثبت نکن
        return{ok:false,noConn:true};
      }
      const dayNameCalc=(()=>{try{const tp=today.split('/').map(Number);const tg=jalaliToGregorian(tp[0],tp[1],tp[2]);return WD[new Date(tg[0],tg[1]-1,tg[2]).getDay()];}catch{return '';}})();
      const _hn=SHIFT==='night'?hallNight:[0,0,0,0,0,0];
      const _hd=SHIFT==='day'?hallDay:[0,0,0,0,0,0];
      const newEntry={
        id:'e_'+Date.now(),date:today,dayName:dayNameCalc,age,
        hallNight:SHIFT==='night'?hallNight:null,
        hallDay:SHIFT==='day'?hallDay:null,
        hallDead:_hn.map((n,j)=>n+(_hd[j]||0)),
        d:_hn.map((n,j)=>n+(_hd[j]||0)),
        cull:SHIFT==='day'?hallCull:[0,0,0,0,0,0],
        totalCull:SHIFT==='day'?cullTotal:0,
        totalC:SHIFT==='day'?cullTotal:0,
        totalNight:SHIFT==='night'?nightTotal:null,
        totalDay:SHIFT==='day'?dayTotal:null,
        _nightDone:SHIFT==='night',_dayDone:SHIFT==='day',
        feed:feedVal,water:0,temp:0,_fromWorker:true,
        totalD:null,totalAll:null
      };
      entries.push(newEntry);
    }

    const ok=await safeSave(`e_${PERIOD_ID}`,entriesSnapshot,entries,0);
    return{ok,entries};
  }

  toast('🔄 دریافت آخرین داده از سرور...',3000);
  let result=await attemptOnce();
  if(result.noConn){
    toast('❌ اتصال به سرور برقرار نشد — برای جلوگیری از پاک شدن اطلاعات ثبت‌شده روی گوشی‌های دیگه، ثبت انجام نشد. لطفاً با اینترنت بهتر دوباره امتحان کن.',8000);
    return;
  }

  // تایید: دوباره تازه از سرور بخون و مطمئن شو شیفتی که الان ثبت کردیم واقعاً نشسته
  // (اگه گوشی دیگه‌ای دقیقاً هم‌زمان ثبت کرده باشه و رقابت پیش اومده باشه، اینجا یه‌بار دیگه تلاش می‌کنیم)
  let verified=false;
  for(let tries=0;tries<2&&!verified;tries++){
    if(result.ok){
      await new Promise(r=>setTimeout(r,500));
      const checkRaw=await cfGetFresh(`e_${PERIOD_ID}`);
      const check=checkRaw==='NOT_FOUND'?[]:checkRaw;
      const ce=Array.isArray(check)?check.find(e=>e.date===today):null;
      if(ce&&((SHIFT==='night'&&ce._nightDone===true)||(SHIFT==='day'&&ce._dayDone===true))){
        verified=true;
      }
    }
    if(!verified){
      // دوباره از اول (تازه‌خوانی + ادغام + ذخیره) رو امتحان کن — احتمالاً گوشی دیگه‌ای هم‌زمان نوشته بود
      result=await attemptOnce();
    }
  }

  const entries=result.entries;
  const ok=result.ok&&verified;
  if(ok){
    try{localStorage.setItem(`e_${PERIOD_ID}`,JSON.stringify(entries));}catch{}
    const savedEntry=entries.find(e=>e.date===today);
    const bothDone=savedEntry&&savedEntry._dayDone===true&&savedEntry._nightDone===true;
    if(bothDone){
      toast(`✅ شیفت ${SHIFT==='night'?'شب 🌙':'روز ☀️'} ثبت شد — روز کامل شد`,3500);
    } else {
      const waiting=SHIFT==='night'?'شیفت روز':'شیفت شب';
      toast(`✅ شیفت ${SHIFT==='night'?'شب 🌙':'روز ☀️'} ثبت شد — منتظر ${waiting}`,3500);
    }
    const shiftHalls=SHIFT==='night'?hallNight:hallDay;
    const shiftTotal2=SHIFT==='night'?nightTotal:dayTotal;
    sendTelegramAlert(today,SHIFT,shiftTotal2,cullTotal,feedVal,shiftHalls,hallCull);
    clearAll();
    const sbOk=document.getElementById('sendBtn');if(sbOk)sbOk.textContent='📤 ارسال به کارت جوجه';
    await loadHistory();
    await setUnregisteredDate(PERIOD_ID,entries);
    logChange('ثبت تلفات',SHIFT==='night'?'شیفت شب':'شیفت روز',`تاریخ ${today} — ${shiftTotal2} تلفات${SHIFT==='day'&&cullTotal?`، ${cullTotal} سربریده`:''}`);
  } else {
    toast('⚠️ ثبت انجام شد ولی تاییدش از سرور موفق نبود — لطفاً چند ثانیه صبر کن و دوباره امتحان کن، یا کارت جوجه رو چک کن که این ثبت اومده باشه.',7000);
  }
}

      const res=await kjTalfatSendMessage(chatId,msg);
      const text=await res.text();
      let data; try{ data=JSON.parse(text); }catch(e){ data={ok:false}; }
      console.log('telegram result:',chatId,res.status,text);
      if(!data.ok)anyError=`HTTP ${res.status}: ${text.slice(0,200)}`;
    }catch(e){
      console.error('telegram alert error:',chatId,e);
      anyError='خطای شبکه: '+(e&&e.message?e.message:String(e));
    }
  }
  if(anyError)toast('⚠️ خطا در ارسال نوتیف به برخی گیرنده‌ها: '+anyError,7000);
}

async function loadHistory(forceRefresh=false){
  const el=document.getElementById('historyList');
  el.innerHTML='<div style="text-align:center;color:#999;font-size:13px;padding:12px">⏳ در حال بارگذاری...</div>';
  try{
    let entries;
    if(forceRefresh){
      // وقتی کاربر صراحتاً «بارگذاری» می‌زنه، یعنی می‌خواد آخرین وضعیت واقعی رو ببینه —
      // پس سرور باید تنها منبع حقیقت باشه، نه merge با کش محلی (که می‌تونه رکورد حذف‌شده رو دوباره زنده کنه)
      const _se=await cfGetFresh(`e_${PERIOD_ID}`);
      if(Array.isArray(_se)){
        // سرور داده واقعی داد — localStorage رو به‌روز کن
        entries=_se;
        try{localStorage.setItem(`e_${PERIOD_ID}`,JSON.stringify(entries));}catch{}
      } else {
        // NOT_FOUND یا null — از کش محلی استفاده کن و چیزی رو پاک نکن
        try{const lc=localStorage.getItem(`e_${PERIOD_ID}`);entries=lc?JSON.parse(lc):[];}catch{entries=[];}
        if(_se===null){toast('⚠️ سرور جواب نداد — از حافظه محلی نشون میده',5000);}
        else{toast('ℹ️ داده‌ای در سرور یافت نشد — از حافظه محلی نشون میده',4000);}
      }
    } else {
      entries=await cfGet(`e_${PERIOD_ID}`)||[];
    }
    if(!Array.isArray(entries))entries=[];
    // فیلتر هر آیتم خراب (بدون تاریخ معتبر) تا هیچ‌جا کرش نکنه
    entries=entries.filter(e=>e&&typeof e.date==='string'&&e.date.length>0);
    const filtered=entries.filter(e=>{
      const hasGeneric=(e.totalD>0)||(Array.isArray(e.d)&&e.d.some(x=>x>0));
      if(hasGeneric)return true;
      if(SHIFT==='night') return e.totalNight>0||(e.hallNight&&e.hallNight.some(x=>x>0));
      return e.totalDay>0||(e.hallDay&&e.hallDay.some(x=>x>0))||e.totalCull>0;
    }).sort((a,b)=>b.date.localeCompare(a.date));
    if(!filtered.length){el.innerHTML=`<div style="text-align:center;color:#999;font-size:13px;padding:12px">سابقه‌ای برای شیفت ${SHIFT==='night'?'شب':'روز'} وجود ندارد</div>`;return;}
    el.innerHTML=filtered.map(e=>{
      const isComplete=e._dayDone===true&&e._nightDone===true;
      const hasShiftFields='_dayDone' in e||'_nightDone' in e;
      let statusTag='';
      if(hasShiftFields){
        if(isComplete) statusTag=`<span style="background:#388e3c;color:#fff;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:bold">✅ کامل</span>`;
        else statusTag=`<span style="background:#ff9800;color:#fff;border-radius:5px;padding:2px 7px;font-size:10px;font-weight:bold">⏳ منتظر ${e._dayDone?'شب 🌙':'روز ☀️'}</span>`;
      }
      const hasShiftSpecific=SHIFT==='night'
        ?(e.totalNight>0||(e.hallNight&&e.hallNight.some(x=>x>0)))
        :(e.totalDay>0||(e.hallDay&&e.hallDay.some(x=>x>0)));
      const hasGeneric=(e.totalD>0)||(Array.isArray(e.d)&&e.d.some(x=>x>0));
      // مقدار پیش‌فرض امن — اگه هیچ‌کدوم از دو شرط زیر برقرار نشد، دیگه hall/tot/icon/label تعریف‌نشده نمونه و کرش نکنه
      let hall=[0,0,0,0,0,0],tot=0,extra='',icon='❔',label='نامشخص';
      if(hasShiftSpecific){
        hall=SHIFT==='night'?(e.hallNight||[0,0,0,0,0,0]):(e.hallDay||[0,0,0,0,0,0]);
        tot=hall.reduce((s,x)=>s+(Number(x)||0),0)||(SHIFT==='night'?(e.totalNight||0):(e.totalDay||0));
        extra=SHIFT==='day'?` | سربریده: ${e.totalCull||0}${e.feed?' | دان: '+e.feed+' کیلوگرم':''}`:'';
        icon=SHIFT==='night'?'🌙':'☀️';label=SHIFT==='night'?'شب':'روز';
      }else if(hasGeneric){
        hall=e.d||[0,0,0,0,0,0];
        tot=e.totalD||hall.reduce((s,x)=>s+(Number(x)||0),0);
        extra=e.feed?` | دان: ${e.feed} کیلوگرم`:'';
        icon='🔀';label='ترکیبی';
      }
      let ageStr='';
      if(PERIOD_START&&e.date){
        try{
          const sp=PERIOD_START.split('/').map(Number),tp=e.date.split('/').map(Number);
          const sg=jalaliToGregorian(sp[0],sp[1],sp[2]),tg=jalaliToGregorian(tp[0],tp[1],tp[2]);
          const diff=Math.round((new Date(tg[0],tg[1]-1,tg[2])-new Date(sg[0],sg[1]-1,sg[2]))/86400000);
          ageStr=` — روز ${diff+1}`;
        }catch{}
      }
      const bg=isComplete?'#f1f8e9':(hasShiftFields&&!isComplete?'#fff8e1':'#fafafa');
      const border=isComplete?'#a5d6a7':(hasShiftFields&&!isComplete?'#ffcc80':'#e0e0e0');
      return `
      <div style="border:1px solid ${border};border-radius:10px;padding:10px;margin-bottom:8px;background:${bg}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-weight:800;font-size:13px;color:#1b5e20">${e.date} — ${e.dayName||''}${ageStr} ${icon}</span>
          <div style="display:flex;gap:6px">
            <button onclick="editEntry('${e.date}')" style="background:#e3f2fd;border:1px solid #1565c0;border-radius:6px;padding:3px 8px;font-size:11px;color:#1565c0;cursor:pointer">✏️ ویرایش</button>
            <button onclick="deleteEntry('${e.id||''}')" style="background:#ffebee;border:1px solid #c62828;border-radius:6px;padding:3px 8px;font-size:11px;color:#c62828;cursor:pointer">🗑️ حذف</button>
          </div>
        </div>
        <div style="margin-bottom:4px">${statusTag}</div>
        <div style="font-size:12px;color:#555">تلفات ${label}: <b>${tot}</b> قطعه | سالن‌ها: ${hall.join('، ')}${extra}</div>
      </div>`;
    }).join('');
  }catch(err){
    console.error('loadHistory error:',err);
    el.innerHTML=`<div style="text-align:center;color:#c62828;font-size:13px;padding:12px">⚠️ خطا در بارگذاری سابقه — دوباره «🔄 بارگذاری» را بزنید</div>`;
  }
}

async function deleteEntry(id){
  if(!confirm('این ثبت حذف شود؟'))return;
  const _ef=await cfGetFresh(`e_${PERIOD_ID}`);
  const entries=(_ef===null||_ef==='NOT_FOUND')?[]:_ef;
  const target=entries.find(e=>e.id===id);
  const newEntries=entries.filter(e=>e.id!==id);
  const ok=await safeSave(`e_${PERIOD_ID}`,entries,newEntries,1);
  if(ok){
    try{localStorage.setItem(`e_${PERIOD_ID}`,JSON.stringify(newEntries));}catch{}
    toast('✅ حذف شد');
    loadHistory();
    await setUnregisteredDate(PERIOD_ID,newEntries);
    logChange('ثبت تلفات','حذف',target?`تاریخ ${target.date}`:id);
  }
  else toast('⚠️ خطا در حذف');
}

async function editEntry(id){
  toast('⏳ در حال بارگذاری...');
  const entries=await cfGet(`e_${PERIOD_ID}`)||[];
  let e=entries.find(x=>x.date===id);
  if(!e) e=entries.find(x=>x.id===id);
  if(!e){toast('⚠️ پیدا نشد — بارگذاری کنید');return;}
  TARGET_DATE=e.date;
  let ageCalc='';
  if(PERIOD_START&&e.date){
    try{
      const sp=PERIOD_START.split('/').map(Number);
      const tp=e.date.split('/').map(Number);
      const sg=jalaliToGregorian(sp[0],sp[1],sp[2]);
      const tg=jalaliToGregorian(tp[0],tp[1],tp[2]);
      const diff=Math.round((new Date(tg[0],tg[1]-1,tg[2])-new Date(sg[0],sg[1]-1,sg[2]))/86400000);
      ageCalc=` — روز ${diff+1}`;
    }catch(ageErr){console.error('editEntry age calc failed:',ageErr,'PERIOD_START=',PERIOD_START,'e.date=',e.date);}
  }else{
    console.error('editEntry age calc skipped: PERIOD_START=',PERIOD_START,'e.date=',e.date);
  }
  document.getElementById('dateLabel').textContent=`⚠️ در حال ویرایش تاریخ قدیمی: ${e.dayName||''} ${e.date}${ageCalc}`;
  document.getElementById('dateLabel').style.background='#ffebee';
  document.getElementById('dateLabel').style.color='#c62828';
  document.getElementById('dateLabel').style.border='2px solid #c62828';
  document.getElementById('hdrDate').textContent=`${e.dayName||''} ${e.date}${ageCalc}`;
  // پر کردن فیلدها - تلفات شب
  if(e.hallNight){
    e.hallNight.forEach((v,i)=>{const el=document.getElementById('n'+(i+1));if(el)el.value=v||0;});
  } else if(e.hallDead){
    // داده قدیمی - نصف به شب نصف به روز
    e.hallDead.forEach((v,i)=>{
      const n=document.getElementById('n'+(i+1));
      if(n)n.value=v||0;
    });
  }
  // تلفات روز
  if(e.hallDay){
    e.hallDay.forEach((v,i)=>{const el=document.getElementById('d'+(i+1));if(el)el.value=v||0;});
  }
  // سربریده
  if(e.cull){
    e.cull.forEach((v,i)=>{const el=document.getElementById('c'+(i+1));if(el)el.value=v||0;});
  }
  // دان
  const feedEl=document.getElementById('feedInput');
  if(feedEl)feedEl.value=e.feed||'';
  calcTotals();
  window.scrollTo(0,0);
  toast('⚠️ داری تاریخ قدیمی رو ویرایش می‌کنی — مقادیر را ویرایش کنید و ارسال بزنید، یا لغو کنید',4000);
  const sbEd=document.getElementById('sendBtn');if(sbEd)sbEd.textContent='💾 ذخیره و ارسال (تاریخ قدیمی)';
  const cbEd=document.getElementById('cancelEditBtn');if(cbEd)cbEd.style.display='block';
}

function cancelEditMode(){
  clearAll();
  setUnregisteredDate(PERIOD_ID);
  toast('↩️ ویرایش لغو شد — برگشتی به تاریخ امروز');
}

function clearAll(){
  for(let i=1;i<=6;i++){
    document.getElementById('n'+i).value='';
    document.getElementById('d'+i).value='';
    document.getElementById('c'+i).value='';
  }
  const feedEl=document.getElementById('feedInput');
  if(feedEl)feedEl.value='';
  calcTotals();
}

// ساخت سالن‌ها
buildHalls('nightHalls','n');
buildHalls('dayHalls','d');
buildHalls('cullHalls','c');
calcTotals();
