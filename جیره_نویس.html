<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<title>جیره‌نویس مرغ گوشتی 🌽</title>
<style>
:root{--g1:#1b5e20;--g2:#2e7d32;--g3:#388e3c;--accent:#f5c842;--bg:#f1f4f1;--card:#fff;--text:#1a2a1a;--muted:#6a7a6a;--red:#c62828;--ok:#1b5e20;--r:12px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:30px;font-size:14px}
.hdr{background:linear-gradient(135deg,var(--g1) 0%,var(--g3) 100%);color:#fff;padding:14px 16px 0}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hdr-top h1{font-size:20px;font-weight:900;letter-spacing:-.3px}
.hdr-top span{font-size:22px}
.tabs{display:flex;gap:2px}
.tabs button{flex:1;padding:9px 4px;background:rgba(0,0,0,.15);border:none;color:rgba(255,255,255,.7);font-size:12px;font-weight:700;cursor:pointer;border-radius:8px 8px 0 0;font-family:inherit;transition:all .15s}
.tabs button.on{background:var(--card);color:var(--g2);border-bottom:3px solid var(--accent)}
section{display:none} section.on{display:block}
.card{background:var(--card);border-radius:var(--r);margin:10px 10px 0;padding:12px;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.ctitle{font-weight:800;color:var(--g2);font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:5px;border-bottom:2px solid #e8f5e9;padding-bottom:6px}
table.itbl{width:100%;border-collapse:collapse;font-size:12px}
table.itbl th{background:var(--g2);color:#fff;padding:6px 3px;text-align:center;font-size:11px;font-weight:700}
table.itbl td{padding:3px 2px;border-bottom:1px solid #f0f0f0;text-align:center;vertical-align:middle}
table.itbl td:first-child{text-align:right;font-size:11px;padding-right:4px}
table.itbl input[type=number]{width:100%;border:1px solid #ddd;border-radius:5px;padding:4px 3px;text-align:center;font-size:12px;font-family:inherit;background:#fafff8}
table.itbl input[type=number]:focus{outline:none;border-color:var(--g3);background:#fff}
.req-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rfield label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;font-weight:600}
.rfield input{width:100%;border:1px solid #ddd;border-radius:7px;padding:7px;font-size:13px;font-family:inherit;text-align:center;background:#fafff8}
.rfield input:focus{outline:none;border-color:var(--g3);background:#fff}
.calc-btn{display:block;width:calc(100% - 20px);margin:12px 10px 0;padding:15px;background:linear-gradient(135deg,var(--g1),var(--g3));color:#fff;font-size:16px;font-weight:900;border:none;border-radius:var(--r);cursor:pointer;font-family:inherit;letter-spacing:.5px;box-shadow:0 4px 12px rgba(27,94,32,.35)}
.calc-btn:active{transform:scale(.98);box-shadow:0 2px 6px rgba(27,94,32,.25)}
.result-hdr{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:var(--r) var(--r) 0 0;padding:12px 14px;margin:10px 10px 0}
.result-hdr h2{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:4px}
.result-hdr .cost{font-size:24px;font-weight:900}
.result-hdr .cost span{font-size:12px;opacity:.8;font-weight:400}
.formula-card{background:var(--card);margin:0 10px;padding:10px;border-radius:0 0 var(--r) var(--r);box-shadow:0 3px 8px rgba(0,0,0,.1)}
.formula-row{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid #f0f0f0;gap:8px}
.formula-row:last-child{border-bottom:none}
.formula-name{flex:1;font-size:12px;color:var(--text)}
.formula-bar-wrap{flex:2;background:#f0f0f0;border-radius:10px;height:8px;overflow:hidden}
.formula-bar{height:100%;background:linear-gradient(90deg,var(--g3),var(--g4,#66bb6a));border-radius:10px;transition:width .4s}
.formula-pct{font-size:13px;font-weight:800;color:var(--g2);min-width:36px;text-align:left}
.nutr-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 10px 0}
.nutr-item{border-radius:10px;padding:8px 6px;text-align:center;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.07)}
.nutr-item .nv{font-size:15px;font-weight:900}
.nutr-item .nr{font-size:9px;color:var(--muted);margin-top:1px}
.nutr-item .nn{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600}
.nutr-item.ok{background:#e8f5e9} .nutr-item.ok .nv{color:var(--ok)}
.nutr-item.bad{background:#ffebee} .nutr-item.bad .nv{color:var(--red)}
.error-box{background:#ffebee;border:2px solid #ef9a9a;border-radius:var(--r);margin:10px 10px 0;padding:14px;color:var(--red);font-size:13px;text-align:center;font-weight:700;line-height:1.6}
.hidden{display:none}
.badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;margin-top:4px}
.hint{font-size:10px;color:var(--muted);text-align:center;margin-top:6px}
</style>

const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhyamdva29ucHl1bmh4bHBiaHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MTM2MzUsImV4cCI6MjA5Mzk4OTYzNX0.vvy9g2kbYEFkNYHwWgi-xf3xQBeMYVcZOYRKGjMFUl8';

// ── همون لایه‌ی Firebase که توی کارت_جوجه/ثبت_تلفات/آب استفاده می‌شه — چون Supabase مستقیم از ایران بدون VPN معمولاً جواب نمی‌ده ──
const FB_PROJECT_ID='farm2020-f56ec';
const FB_API_KEY='AIzaSyDzcy6xdx4uPgcfs3-ATt4vTnupxeo8lCk';
const FB_URL=`https://firestore.googleapis.com/v1/projects/${FB_PROJECT_ID}/databases/(default)/documents`;
function fbDocId(k){return `${FARM}_${k}`.replace(/[^a-zA-Z0-9_-]/g,'_');}
async function fbGet(k){
  try{
    const r=await fetch(`${FB_URL}/kv_store/${fbDocId(k)}?key=${FB_API_KEY}`,{signal:AbortSignal.timeout(8000)});
    if(r.status===404)return'NOT_FOUND';
    if(!r.ok)return null;
    const d=await r.json();
    const raw=d.fields&&d.fields.value&&d.fields.value.stringValue;
    if(raw===undefined)return'NOT_FOUND';
    const updatedAt=(d.fields&&d.fields.updated_at&&d.fields.updated_at.stringValue)||null;
    return{value:JSON.parse(raw),updatedAt};
  }catch{return null;}
}
// اول Firebase و Worker/Supabase رو هم‌زمان می‌خونه، بعد هر کدوم واقعاً تازه‌تر بود رو انتخاب می‌کنه —
// اگه هیچ‌کدوم جواب ندادن، null برمی‌گردونه (نه فرضِ خالی‌بودن)
async function cfGetFresh(k){
  const urls=[
    `${CF_URL}/rest/v1/kv_store?farm=eq.${FARM}&key=eq.${k}&select=value,updated_at&order=updated_at.desc&limit=1`,
    `${SB_URL}/rest/v1/kv_store?farm=eq.${FARM}&key=eq.${k}&select=value,updated_at&order=updated_at.desc&limit=1`
  ];
  const fbPromise=fbGet(k);
  const sbPromise=Promise.allSettled(urls.map(async url=>{
    const r=await fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},cache:'no-store',signal:AbortSignal.timeout(4000)});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    if(!d||!d.length)return{empty:true};
    const val=d[0].value;
    return{value:typeof val==='string'?JSON.parse(val):val,updatedAt:d[0].updated_at||null};
  }));
  const [fb,sbAttempts]=await Promise.all([fbPromise,sbPromise]);
  let sbValue=null,sbConfirmedEmpty=false;
  for(const a of sbAttempts){
    if(a.status==='fulfilled'){
      if(a.value.empty)sbConfirmedEmpty=true;
      else{sbValue=a.value;break;}
    }
  }
  const fbHasValue=fb&&typeof fb==='object';
  let winner=null;
  if(fbHasValue&&sbValue)winner=(new Date(fb.updatedAt||0).getTime()>=new Date(sbValue.updatedAt||0).getTime())?fb:sbValue;
  else winner=fbHasValue?fb:sbValue;
  if(winner)return winner.value;
  if(fb==='NOT_FOUND'&&sbConfirmedEmpty)return'CONFIRMED_EMPTY';
  return null;
}

function matchNutrition(name){

  if(n.includes('سویا')&&(n.includes('44')||n.includes('۴۴'))) return {ME:2230,CP:44,Lys:2.90,MC:1.30,Ca:0.33,Pa:0.24};
  if(n.includes('گندم')&&!n.includes('سبوس')) return {ME:3090,CP:12,Lys:0.35,MC:0.45,Ca:0.06,Pa:0.18};
  if(n.includes('سبوس')) return {ME:1560,CP:16,Lys:0.58,MC:0.58,Ca:0.13,Pa:0.24};
  if(n.includes('آفتابگردان')) return {ME:1980,CP:32,Lys:1.10,MC:1.20,Ca:0.40,Pa:0.22};
  if(n.includes('پودر')&&n.includes('ماهی')) return {ME:2900,CP:65,Lys:5.00,MC:2.70,Ca:4.50,Pa:2.50};
  if(n.includes('روغن')) return {ME:8900,CP:0,Lys:0,MC:0,Ca:0,Pa:0};
  if(n.includes('کربنات')||n.includes('آهک')||n.includes('صدف')) return {ME:0,CP:0,Lys:0,MC:0,Ca:38,Pa:0};
  if((n.includes('دی')&&n.includes('کلسیم'))||n.includes('dcp')||(n.includes('فسفات')&&!n.includes('سویا'))) return {ME:0,CP:0,Lys:0,MC:0,Ca:22,Pa:18};
  if(n.includes('متیونین')) return {ME:0,CP:0,Lys:0,MC:99,Ca:0,Pa:0};
  if(n.includes('لیزین')) return {ME:0,CP:0,Lys:78,MC:0,Ca:0,Pa:0};
  if(n.includes('جو')&&!n.includes('جوجه')) return {ME:2640,CP:11.5,Lys:0.40,MC:0.45,Ca:0.07,Pa:0.14};
  if(n.includes('سورگوم')) return {ME:3260,CP:10,Lys:0.22,MC:0.42,Ca:0.03,Pa:0.09};
  return {ME:0,CP:0,Lys:0,MC:0,Ca:0,Pa:0,unknown:true};
}

let loadedFromServer=false;

function _getMax(name){
  const n=name.toLowerCase();
  if(n.includes('ذرت')) return 70;
  if(n.includes('سویا')) return 45;
  if(n.includes('روغن')) return 5;
  if(n.includes('دی کلسیم')||n.includes('فسفات')) return 3;
  if(n.includes('کربنات')||n.includes('آهک')||n.includes('صدف')) return 3;
  if(n.includes('لیزین')) return 0.5;
  if(n.includes('متیونین')) return 0.5;
  if(n.includes('ترئونین')) return 0.2;
  if(n.includes('گندم')) return 30;
  if(n.includes('جو')&&!n.includes('جوجه')) return 20;
  return 3;
}

}

async function loadIngrFromRations(){
  try{
    if(typeof fetch==='undefined')return false;
    // ── مرحله ۱: خواندن active ──
    const activeId=await cfGetFresh('active');
    if(activeId===null){showDiag('❌ active fetch failed (نه Firebase نه Supabase/Worker جواب دادن)');return false;}
    if(activeId==='CONFIRMED_EMPTY'){showDiag('❌ کلید active توی سرور پیدا نشد');return false;}
    showDiag('✅ active: '+activeId);

    // ── مرحله ۲: خواندن rat_ ──
    const rations0=await cfGetFresh(`rat_${activeId}`);
    if(rations0===null){showDiag('❌ rat fetch failed (نه Firebase نه Supabase/Worker جواب دادن)');return false;}
    if(rations0==='CONFIRMED_EMPTY'){showDiag('❌ rat_'+activeId+' پیدا نشد');return false;}
    showDiag('✅ rat_ found. type:'+typeof rations0+' sample:'+JSON.stringify(rations0).substring(0,200));
    const rations=rations0;
    if(!rations){showDiag('❌ rations null');return false;}
    // rations ممکنه array یا object باشه
    const rationArr=Array.isArray(rations)?rations:[rations];
    showDiag('rations length:'+rationArr.length+' keys:'+Object.keys(rationArr[0]||{}).join(','));
    // استخراج نام و قیمت مستقیم از ردیف‌های جیره
    const ingrMap={}; // name → {price, amt}
    rationArr.forEach(rat=>{
      const rows=rat.items||rat.rows||rat.ingredients||rat.entries||(Array.isArray(rat)?rat:[]);
      showDiag('rat rows count:'+(Array.isArray(rows)?rows.length:'NOT_ARRAY:'+typeof rows));
      if(Array.isArray(rows)) showDiag('raw row names: '+rows.map(r=>`"${r.name||r.mat||r.material||'?'}"`).join(', '));
      rows.forEach(row=>{
        const n=(row.name||row.mat||row.material||'').trim();
        if(!n)return;
        const p=+(row.price||row.unitPrice||row.avgPrice||row.pricePerKg||0);
        const a=+(row.amount||row.qty||row.kg||0);
        if(!ingrMap[n]||p>0) ingrMap[n]={price:p,amt:a};
      });
    });
    showDiag('ingrMap keys:'+Object.keys(ingrMap).join(', '));
    if(!Object.keys(ingrMap).length){
      showDiag('❌ ingrMap empty - no rows found');
      return false;
    }

    const FIXED_NAMES=['پریمیکس','نمک','premix','salt'];
    INGR.length=0;
    // مهم: قبل از پرکردن از دادهٔ واقعی، لیستِ موادِ ثابت رو کاملاً خالی می‌کنیم — وگرنه موادِ
    // پیش‌فرضِ قدیمیِ خودِ کد (مثلاً «آنزیمیت») با موادِ واقعیِ همین دوره (مثلاً «آنزیمیت (زئولیت)»)
    // که اسمشون یکی نیست، هردو تو لیست می‌موندن و درصدشون دوبار حساب می‌شد
    FIXED_ITEMS.length=0;
    Object.entries(ingrMap)
      .filter(([n])=>!FIXED_NAMES.includes(n.toLowerCase()))
      .forEach(([name,data],i)=>{
        const nutr=matchNutrition(name);
        INGR.push({id:'i'+i,name,...nutr,min:0,max:_getMax(name),price:Math.round((data.price||0)/10)});
      });
    // نمک (و مشابه‌هاش) از موادِ متغیر فیلتر شده بودن؛ مستقیم از رو دادهٔ واقعی به‌عنوان مادهٔ ثابت اضافه‌شون کن
    Object.entries(ingrMap)
      .filter(([n])=>FIXED_NAMES.includes(n.toLowerCase()))
      .forEach(([name,data])=>{
        FIXED_ITEMS.push({name,pct:Math.min(Math.max((data.amt||0)/10,0),5),price:Math.round((data.price||0)/10),ME:0,CP:0,Lys:0,MC:0,Ca:0,Pa:0});
      });
    showDiag('INGR built, count:'+INGR.length);
    // جداسازی افزودنی‌ها از متغیرها
    for(let i=INGR.length-1;i>=0;i--){
      if(_isAdditive(INGR[i].name)){
        const f=FIXED_ITEMS.find(x=>x.name===INGR[i].name);
        const pct=Math.min(Math.max(ingrMap[INGR[i].name]?.amt/10||0.1,0),5);
        if(!f) FIXED_ITEMS.push({name:INGR[i].name,pct,price:INGR[i].price,ME:0,CP:0,Lys:0,MC:0,Ca:0,Pa:0});
        else{if(!f.price&&INGR[i].price)f.price=INGR[i].price;}
        INGR.splice(i,1);
      }
    }
    showDiag('after additive split, INGR count:'+INGR.length+' FIXED count:'+FIXED_ITEMS.length);
    // قیمت مواد ثابت موجود
    FIXED_ITEMS.forEach(f=>{
      const d=ingrMap[f.name];
      if(d&&d.price) f.price=Math.round(d.price/10);
    });
    showDiag('✅ loadIngrFromRations completed successfully');
    return true;
  }catch(e){showDiag('❌ EXCEPTION: '+e.message+' at '+(e.stack||'').split('\n')[1]);console.error(e);return false;}
}

// ═══ حل کننده LP (Big-M Simplex) ═══
class LP {
  constructor(){this.EPS=1e-9; this.BIG_M=1e7; this.MAX_ITER=8000;}

  // min c'x, A_le*x<=b_le, A_ge*x>=b_ge, A_eq*x=b_eq, x>=0
  solve(c, A_le,b_le, A_ge,b_ge, A_eq,b_eq){
    const n=c.length, mle=b_le.length, mge=b_ge.length, meq=b_eq.length;
    const M=this.BIG_M, EPS=this.EPS;
    // variable layout: orig(n) | sl_le(mle) | surp_ge(mge) | sl_eq_extra | art_ge(mge) | art_eq(meq)
    const i_sl=n, i_surp=n+mle, i_art_ge=n+mle+mge, i_art_eq=n+mle+2*mge;
    const nT=n+mle+2*mge+meq, mT=mle+mge+meq;
    const T=Array.from({length:mT+1},()=>new Array(nT+1).fill(0));
    const bas=new Array(mT);

    // <= rows
    for(let i=0;i<mle;i++){
      for(let j=0;j<n;j++)T[i][j]=A_le[i][j];
      T[i][i_sl+i]=1; T[i][nT]=b_le[i]; bas[i]=i_sl+i;
    }
    // >= rows
    for(let i=0;i<mge;i++){
      for(let j=0;j<n;j++)T[mle+i][j]=A_ge[i][j];
      T[mle+i][i_surp+i]=-1; T[mle+i][i_art_ge+i]=1; T[mle+i][nT]=b_ge[i]; bas[mle+i]=i_art_ge+i;
    }
    // = rows
    for(let i=0;i<meq;i++){
      for(let j=0;j<n;j++)T[mle+mge+i][j]=A_eq[i][j];
      T[mle+mge+i][i_art_eq+i]=1; T[mle+mge+i][nT]=b_eq[i]; bas[mle+mge+i]=i_art_eq+i;
    }
    // objective
    for(let j=0;j<n;j++)T[mT][j]=c[j];
    for(let j=i_art_ge;j<nT;j++)T[mT][j]=M;
    // price out artificials
    for(let i=0;i<mT;i++){
      const bv=bas[i]; if(bv<i_art_ge)continue;
      const co=T[mT][bv]; if(Math.abs(co)<EPS)continue;
      for(let j=0;j<=nT;j++)T[mT][j]-=co*T[i][j];
    }
    // iterate
    for(let it=0;it<this.MAX_ITER;it++){
      let pc=-1,mn=-(EPS*100);
      for(let j=0;j<nT;j++){if(T[mT][j]<mn){mn=T[mT][j];pc=j;}}
      if(pc<0)break;
      let pr=-1,mr=Infinity;
      for(let i=0;i<mT;i++){
        if(T[i][pc]>EPS){const r=T[i][nT]/T[i][pc];if(r<mr-EPS){mr=r;pr=i;}}
      }
      if(pr<0)return{status:'unbounded'};
      const pv=T[pr][pc];
      for(let j=0;j<=nT;j++)T[pr][j]/=pv;
      for(let i=0;i<=mT;i++){
        if(i===pr)continue;
        const f=T[i][pc]; if(Math.abs(f)<EPS)continue;
        for(let j=0;j<=nT;j++)T[i][j]-=f*T[pr][j];
      }
      bas[pr]=pc;
    }
    // check feasibility
    for(let i=0;i<mT;i++){
      if(bas[i]>=i_art_ge&&T[i][nT]>1e-4)return{status:'infeasible'};
    }
    const x=new Array(n).fill(0);
    for(let i=0;i<mT;i++){if(bas[i]<n)x[bas[i]]=T[i][nT];}
    return{status:'optimal',x,value:-T[mT][nT]};
  }
}

// ═══ محاسبه جیره ═══
function calculate(){
  const btn=document.querySelector('.calc-btn');
  btn.textContent='⏳ در حال محاسبه...';
  btn.disabled=true;
  setTimeout(()=>{
    try{_doCalc();}catch(e){
      document.getElementById('resultArea').innerHTML=`<div class="error-box">خطا: ${e.message}</div>`;
    }
    btn.textContent='⚡ محاسبه جیره ارزان‌قیمت';
    btn.disabled=false;
  },50);
}

function _doCalc(){
  // نمایش وضعیت INGR
  showDiag('INGR count:'+INGR.length+' | '+INGR.map(g=>g.name+'('+g.max+'%)').join(', '));
  showDiag('FREE_TOTAL:'+FREE_TOTAL.toFixed(2)+' FIXED:'+FIXED_ITEMS.length);
  if(!INGR.length){
    document.getElementById('resultArea').innerHTML='<div class="error-box">⚠️ هیچ ماده متغیری پیدا نشد — لیست از Supabase بارگذاری نشد</div>';
    return;
  }
  // read inputs
  const ingr=INGR.map((g,i)=>({
    ...g,
    price:+document.getElementById('price_'+i).value||0,
    min:+document.getElementById('min_'+i).value||0,
    max:+document.getElementById('max_'+i).value||g.max,
  }));
  const fixedIngr=FIXED_ITEMS.map((f,i)=>({...f,
    price:+(document.getElementById('fprice_'+i)||{}).value||0,
    pct:+(document.getElementById('fpct_'+i)||{value:f.pct}).value||f.pct,
  }));
  const fixedTotalPct=fixedIngr.reduce((s,f)=>s+f.pct,0);
  const freeTotal=100-fixedTotalPct;
  const fixedCost=fixedIngr.reduce((s,f)=>s+f.price*f.pct,0);
  const req={
    ME:    +document.getElementById('req_ME').value,
    CP:    +document.getElementById('req_CP').value,
    Lys:   +document.getElementById('req_Lys').value,
    MC:    +document.getElementById('req_MC').value,
    Ca_min:+document.getElementById('req_Ca_min').value,
    Ca_max:+document.getElementById('req_Ca_max').value,
    Pa:    +document.getElementById('req_Pa').value,
  };

  const n=ingr.length;
  // c: cost
  const c=ingr.map(g=>g.price);

  // A_le, b_le: <= constraints
  // 1. x_i <= max_i
  const A_le=[]; const b_le=[];
  for(let i=0;i<n;i++){
    const row=new Array(n).fill(0); row[i]=1;
    A_le.push(row); b_le.push(ingr[i].max);
  }
  // 2. Ca <= Ca_max
  const rowCaMax=ingr.map(g=>g.Ca); A_le.push(rowCaMax); b_le.push(req.Ca_max*100);
  // 3. sum <= FREE_TOTAL (for equality, also have >= below)
  A_le.push(new Array(n).fill(1)); b_le.push(freeTotal);

  // A_ge, b_ge: >= constraints
  const A_ge=[]; const b_ge=[];
  // x_i >= min_i
  for(let i=0;i<n;i++){
    const row=new Array(n).fill(0); row[i]=1;
    A_ge.push(row); b_ge.push(ingr[i].min);
  }
  // ME >= req.ME (variables in %, divide contribution by 100)
  A_ge.push(ingr.map(g=>g.ME/100)); b_ge.push(req.ME);
  // CP >= req.CP
  A_ge.push(ingr.map(g=>g.CP)); b_ge.push(req.CP*100/100); // sum(CP_i*x_i/100)>=CP → sum(CP_i*x_i)>=CP*100... no
  // Actually: sum(CP_i * x_i/100) >= req.CP → sum(CP_i * x_i) >= req.CP * 100
  // But with ME I divided by 100 above. Let me be consistent:
  // All nutrients: sum(N_i * x_i) where x_i is % → total nutrient = sum(N_i * x_i / 100)
  // Constraint: sum(N_i * x_i / 100) >= req → sum(N_i * x_i) >= req * 100
  // For ME: sum(ME_i * x_i / 100) >= ME_req → sum(ME_i * x_i) >= ME_req * 100
  // I made an error above. Let me fix:
  A_ge[n] = ingr.map(g=>g.ME); b_ge[n] = req.ME * 100; // ME
  A_ge.push(ingr.map(g=>g.CP)); b_ge.push(req.CP*100);  // CP
  A_ge.push(ingr.map(g=>g.Lys)); b_ge.push(req.Lys*100); // Lys
  A_ge.push(ingr.map(g=>g.MC)); b_ge.push(req.MC*100);   // MC
  A_ge.push(ingr.map(g=>g.Ca)); b_ge.push(req.Ca_min*100); // Ca_min
  A_ge.push(ingr.map(g=>g.Pa)); b_ge.push(req.Pa*100);   // Pa
  // sum >= FREE_TOTAL (equality with A_le above)
  A_ge.push(new Array(n).fill(1)); b_ge.push(freeTotal);

  const solver=new LP();
  const res=solver.solve(c, A_le,b_le, A_ge,b_ge, [],[]);

  if(res.status!=='optimal'){
    document.getElementById('resultArea').innerHTML=`
      <div class="error-box">
        ⚠️ جیره قابل تأمین نیست<br>
        <small style="font-weight:400">محدودیت‌های تغذیه‌ای با این مواد اولیه برآورده نمی‌شود.<br>
        حداکثر مواد اولیه را بیشتر کنید یا محدودیت‌ها را کاهش دهید.</small>
      </div>`;
    return;
  }

  const x=res.x; // percentages of free ingredients
  // compute nutritional values
  const ME_r  = x.reduce((s,xi,i)=>s+ingr[i].ME*xi,0)/100;
  const CP_r  = x.reduce((s,xi,i)=>s+ingr[i].CP*xi,0)/100;
  const Lys_r = x.reduce((s,xi,i)=>s+ingr[i].Lys*xi,0)/100;
  const MC_r  = x.reduce((s,xi,i)=>s+ingr[i].MC*xi,0)/100;
  const Ca_r  = x.reduce((s,xi,i)=>s+ingr[i].Ca*xi,0)/100;
  const Pa_r  = x.reduce((s,xi,i)=>s+ingr[i].Pa*xi,0)/100;
  const cost_per_100kg = x.reduce((s,xi,i)=>s+ingr[i].price*xi,0) + fixedCost;
  const cost_ton = cost_per_100kg * 10;

  // show results
  const fmtN=v=>v.toLocaleString('fa-IR',{maximumFractionDigits:1});
  const fmtP=v=>v.toLocaleString('fa-IR',{maximumFractionDigits:2});
  const fmtC=v=>Math.round(v).toLocaleString('fa-IR');

  // formula rows (only ingredients with x > 0.01)
  const formulaRows = ingr.map((g,i)=>({name:g.name,pct:x[i]}))
    .concat(fixedIngr.map(f=>({name:f.name,pct:f.pct})))
    .filter(r=>r.pct>0.01)
    .sort((a,b)=>b.pct-a.pct);

  const totalCheck = x.reduce((s,v)=>s+v,0) + FIXED.reduce((s,f)=>s+f.pct,0);

  function nutrCard(label, val, req, unit, isLE=false){
    const ok = isLE ? val<=req+1e-4 : val>=req-1e-4;
    return `<div class="nutr-item ${ok?'ok':'bad'}">
      <div class="nv">${fmtP(val)}</div>
      <div class="nr">${isLE?'≤':'≥'} ${req} ${unit}</div>
      <div class="nn">${label}</div>
    </div>`;
  }

  document.getElementById('resultArea').innerHTML = `
    <div class="result-hdr">
      <h2>📊 نتیجه جیره‌نویسی</h2>
      <div class="cost">${fmtC(cost_ton)} <span>تومان/تن</span></div>
      <div class="badge">جمع کل: ${fmtP(totalCheck)}٪</div>
    </div>
    <div class="formula-card">
      <div class="ctitle" style="margin-bottom:8px">📋 فرمول جیره</div>
      ${formulaRows.map(r=>`
        <div class="formula-row">
          <span class="formula-name">${r.name}</span>
          <div class="formula-bar-wrap"><div class="formula-bar" style="width:${r.pct/FREE_TOTAL*100}%"></div></div>
          <span class="formula-pct">${fmtP(r.pct)}٪</span>
        </div>`).join('')}
    </div>
    <div class="nutr-grid">
      ${nutrCard('ME (kcal/kg)', ME_r, req.ME, '', false)}
      ${nutrCard('پروتئین خام%', CP_r, req.CP, '', false)}
      ${nutrCard('لیزین%', Lys_r, req.Lys, '', false)}
      ${nutrCard('Met+Cys%', MC_r, req.MC, '', false)}
      ${nutrCard('کلسیم%', Ca_r, req.Ca_min, '', false)}
      ${nutrCard('فسفر قابل%', Pa_r, req.Pa, '', false)}
    </div>
    <div class="card" style="margin-top:10px">
      <p class="hint" style="text-align:right;color:var(--muted);line-height:1.7;font-size:11px">
        ⚠️ این جیره بر اساس داده‌های استاندارد محاسبه شده.<br>
        قبل از استفاده با متخصص تغذیه دام تأیید شود.<br>
        مواد اولیه: ارزش‌های تغذیه‌ای INRA/NRC — سویه روس ۳۰۸
      </p>
    </div>
  `;
  document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
}
