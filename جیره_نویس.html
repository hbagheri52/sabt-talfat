function fbDocId(k){return `${FARM}_${k}`.replace(/[^a-zA-Z0-9_-]/g,'_');}
async function fbGet(k){
  try{
    const r=await fetch(`${FB_URL}/kv_store/${fbDocId(k)}?key=${FB_API_KEY}`,{signal:AbortSignal.timeout(8000)});
    if(r.status===404)return'NOT_FOUND';
    if(!r.ok)return null;
    const d=await r.json();
    const raw=d.fields&&d.fields.value&&d.fields.value.stringValue;
    if(raw===undefined)return'NOT_FOUND';
    const updatedAt=(d.fields&&d.fields.updated_at&&d.fields.updated_at.stringValue)||null;
    return{value:JSON.parse(raw),updatedAt};
  }catch{return null;}
}
// اول Firebase و Worker/Supabase رو هم‌زمان می‌خونه، بعد هر کدوم واقعاً تازه‌تر بود رو انتخاب می‌کنه —
// اگه هیچ‌کدوم جواب ندادن، null برمی‌گردونه (نه فرضِ خالی‌بودن)
async function cfGetFresh(k){
  const urls=[
    `${CF_URL}/rest/v1/kv_store?farm=eq.${FARM}&key=eq.${k}&select=value,updated_at&order=updated_at.desc&limit=1`,
    `${SB_URL}/rest/v1/kv_store?farm=eq.${FARM}&key=eq.${k}&select=value,updated_at&order=updated_at.desc&limit=1`
  ];
  const fbPromise=fbGet(k);
  const sbPromise=Promise.allSettled(urls.map(async url=>{
    const r=await fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},cache:'no-store',signal:AbortSignal.timeout(4000)});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    if(!d||!d.length)return{empty:true};
    const val=d[0].value;
    return{value:typeof val==='string'?JSON.parse(val):val,updatedAt:d[0].updated_at||null};
  }));
  const [fb,sbAttempts]=await Promise.all([fbPromise,sbPromise]);
  let sbValue=null,sbConfirmedEmpty=false;
  for(const a of sbAttempts){
    if(a.status==='fulfilled'){
      if(a.value.empty)sbConfirmedEmpty=true;
      else{sbValue=a.value;break;}
    }
  }
  const fbHasValue=fb&&typeof fb==='object';
  let winner=null;
  if(fbHasValue&&sbValue)winner=(new Date(fb.updatedAt||0).getTime()>=new Date(sbValue.updatedAt||0).getTime())?fb:sbValue;
  else winner=fbHasValue?fb:sbValue;
  if(winner)return winner.value;
  if(fb==='NOT_FOUND'&&sbConfirmedEmpty)return'CONFIRMED_EMPTY';
  return null;
}

  return {ME:0,CP:0,Lys:0,MC:0,Ca:0,Pa:0,unknown:true};
}

async function loadIngrFromRations(){
  try{
    if(typeof fetch==='undefined')return false;
    // ── مرحله ۱: خواندن active ──
    const activeId=await cfGetFresh('active');
    if(activeId===null){showDiag('❌ active fetch failed (نه Firebase نه Supabase/Worker جواب دادن)');return false;}
    if(activeId==='CONFIRMED_EMPTY'){showDiag('❌ کلید active توی سرور پیدا نشد');return false;}
    showDiag('✅ active: '+activeId);

    // ── مرحله ۲: خواندن لیستِ خریدهای انبار (wh_) — همون منبعی که کارت_جوجه خودش برای «هزینهٔ کل» استفاده می‌کنه ──
    const wh0=await cfGetFresh(`wh_${activeId}`);
    if(wh0===null){showDiag('❌ wh fetch failed (نه Firebase نه Supabase/Worker جواب دادن)');return false;}
    if(wh0==='CONFIRMED_EMPTY'){showDiag('❌ wh_'+activeId+' پیدا نشد — هنوز خریدی برای این دوره ثبت نشده؟');return false;}
    const whList=Array.isArray(wh0)?wh0:[wh0];
    showDiag('✅ wh_ found. records:'+whList.length);
    if(!whList.length){showDiag('❌ لیستِ خرید خالیه');return false;}

    // میانگینِ وزنی‌ِ قیمت هر ماده رو از رویِ همه‌ی خریدهای این دوره حساب می‌کنیم
    // (qty همیشه به کیلو ذخیره شده؛ transport هم به‌عنوانِ بخشی از هزینه‌ی واقعیِ هر کیلو لحاظ می‌شه)
    const agg={}; // mat → {cost, qty}
    whList.forEach(rec=>{
      const n=(rec.mat||rec.name||'').trim();
      if(!n)return;
      const qty=+(rec.qty||0);
      if(qty<=0)return;
      const cost=qty*(+(rec.price||0))+(+(rec.transport||0));
      if(!agg[n])agg[n]={cost:0,qty:0};
      agg[n].cost+=cost;
      agg[n].qty+=qty;
    });
    const ingrMap={};
    Object.entries(agg).forEach(([n,v])=>{
      if(v.qty>0)ingrMap[n]={price:Math.round(v.cost/v.qty),amt:v.qty};
    });
    showDiag('materials:'+Object.keys(ingrMap).join('، '));
    if(!Object.keys(ingrMap).length){
      showDiag('❌ ingrMap empty - no valid purchase records found');
      return false;
    }

    // نامِ ماده رو ساده می‌کنیم (فاصله‌ها، پرانتزها و «ی/ک عربی» حذف بشه) تا مثلاً «مادرو مایسین» با «مادورامایسین»
    // یا «آنزیمیت (زئولیت)» با «آنزیمیت» یکی شناخته بشن، نه اینکه به‌خاطرِ یه فاصله یا پرانتز از هم جدا بمونن
    const norm=s=>String(s).replace(/\(.*?\)/g,'').replace(/[\s‌]/g,'').replace(/ي/g,'ی').replace(/ك/g,'ک').trim().toLowerCase();
    const FIXED_NAMES=['پریمیکس','نمک','premix','salt', ...FIXED_ITEMS.map(f=>f.name)].map(norm);
    INGR.length=0;
    Object.entries(ingrMap)
      .filter(([n])=>!FIXED_NAMES.includes(norm(n)))
      .forEach(([name,data],i)=>{
        const nutr=matchNutrition(name);
        INGR.push({id:'i'+i,name,...nutr,min:0,max:70,price:data.price||0});
      });
    // قیمت مواد ثابت — اینجا هم با همون تطبیقِ ساده‌شده، نه فقط برابریِ کاملِ رشته
    FIXED_ITEMS.forEach(f=>{
      const match=Object.entries(ingrMap).find(([n])=>norm(n)===norm(f.name));
      if(match&&match[1].price) f.price=match[1].price;
    });
    return true;
  }catch(e){console.error(e);return false;}
}

// ═══ حل‌کننده‌ی LP (روشِ Big-M با مقیاسِ پویا برای M و قاعده‌ی بلند برای جلوگیریِ از چرخه) ═══
// حل‌کننده‌ی LP با روشِ Big-M، با بزرگیِ M متناسب با خودِ داده‌ها (نه یه عددِ ثابت)
class LP {
  constructor(){ this.EPS=1e-7; this.MAX_ITER=20000; }

  // min c'x ,  A_le*x<=b_le ,  A_ge*x>=b_ge ,  A_eq*x=b_eq ,  x>=0
  solve(c, A_le,b_le, A_ge,b_ge, A_eq,b_eq){
    const EPS=this.EPS;
    const n=c.length;
    const rows=[];
    A_le.forEach((a,i)=>rows.push({a,sign:'le',b:b_le[i]}));
    A_ge.forEach((a,i)=>rows.push({a,sign:'ge',b:b_ge[i]}));
    A_eq.forEach((a,i)=>rows.push({a,sign:'eq',b:b_eq[i]}));
    rows.forEach(r=>{
      if(r.b<0){
        r.a=r.a.map(v=>-v); r.b=-r.b;
        if(r.sign==='le')r.sign='ge'; else if(r.sign==='ge')r.sign='le';
      }
    });
    const m=rows.length;
    let nSlack=0,nSurplus=0,nArt=0;
    rows.forEach(r=>{ if(r.sign==='le')nSlack++; else if(r.sign==='ge'){nSurplus++;nArt++;} else nArt++; });
    const nCols=n+nSlack+nSurplus+nArt;
    const T=Array.from({length:m+1},()=>new Array(nCols+1).fill(0));
    const basis=new Array(m);
    const colSlack=n, colSurplus=n+nSlack, colArt=n+nSlack+nSurplus;
    const artCols=[];
    let si=0,pi=0,ai=0;
    rows.forEach((r,i)=>{
      for(let j=0;j<n;j++)T[i][j]=r.a[j];
      T[i][nCols]=r.b;
      if(r.sign==='le'){ T[i][colSlack+si]=1; basis[i]=colSlack+si; si++; }
      else if(r.sign==='ge'){ T[i][colSurplus+pi]=-1; pi++; T[i][colArt+ai]=1; basis[i]=colArt+ai; artCols.push(colArt+ai); ai++; }
      else { T[i][colArt+ai]=1; basis[i]=colArt+ai; artCols.push(colArt+ai); ai++; }
    });
    const artSet=new Set(artCols);

    // M باید به‌طورِ چشمگیری از هر عددِ واقعیِ توی مسئله (قیمت‌ها، نیازها) بزرگ‌تر باشه
    const maxData=Math.max(1, ...c.map(v=>Math.abs(v)), ...rows.map(r=>Math.abs(r.b)));
    const M=maxData*1e8;

    if(artCols.length){
      for(let j=0;j<n;j++)T[m][j]=c[j];
      artCols.forEach(cix=>{T[m][cix]=M;});
    } else {
      for(let j=0;j<n;j++)T[m][j]=c[j];
    }
    // تسویه‌ی ردیفِ هدف نسبت به پایه‌ی اولیه
    for(let i=0;i<m;i++){
      const bv=basis[i]; const co=T[m][bv];
      if(Math.abs(co)<EPS)continue;
      for(let j=0;j<=nCols;j++)T[m][j]-=co*T[i][j];
    }

    for(let it=0;it<this.MAX_ITER;it++){
      let pc=-1;
      for(let j=0;j<nCols;j++){ if(T[m][j]<-EPS){ pc=j; break; } } // قاعده‌ی بلند: کوچک‌ترین اندیس
      if(pc<0)break;
      let pr=-1,best=Infinity;
      for(let i=0;i<m;i++){
        if(T[i][pc]>EPS){
          const ratio=T[i][nCols]/T[i][pc];
          if(ratio<best-EPS || (Math.abs(ratio-best)<=EPS && (pr<0||basis[i]<basis[pr]))){ best=Math.min(best,ratio); pr=i; }
        }
      }
      if(pr<0)return{status:'unbounded'};
      const pv=T[pr][pc];
      for(let j=0;j<=nCols;j++)T[pr][j]/=pv;
      for(let i=0;i<=m;i++){
        if(i===pr)continue;
        const f=T[i][pc]; if(Math.abs(f)<EPS)continue;
        for(let j=0;j<=nCols;j++)T[i][j]-=f*T[pr][j];
      }
      basis[pr]=pc;
    }

    // شدنی‌بودن رو مستقیماً از مقدارِ واقعیِ متغیرهای مصنوعیِ باقی‌مانده در جواب چک می‌کنیم
    let sumArt=0;
    for(let i=0;i<m;i++){ if(artSet.has(basis[i])) sumArt+=T[i][nCols]; }
    if(sumArt > 1e-4*Math.max(1,maxData/1e3)) return{status:'infeasible'};

    const x=new Array(n).fill(0);
    for(let i=0;i<m;i++){ if(basis[i]<n) x[basis[i]]=T[i][nCols]; }
    return{status:'optimal', x, value:x.reduce((s,v,i)=>s+v*c[i],0)};
  }
}

// ═══ محاسبه جیره ═══
function calculate(){
  const btn=document.querySelector('.calc-btn');
  btn.textContent='⏳ در حال محاسبه...';
  btn.disabled=true;
  setTimeout(()=>{
    try{_doCalc();}catch(e){
      document.getElementById('resultArea').innerHTML=`<div class="error-box">خطا: ${e.message}</div>`;
    }
    btn.textContent='⚡ محاسبه جیره ارزان‌قیمت';
    btn.disabled=false;
  },50);
}

function _doCalc(){
  // read inputs
  const ingr=INGR.map((g,i)=>({
    ...g,
    price:+document.getElementById('price_'+i).value||0,
    min:+document.getElementById('min_'+i).value||0,
    max:+document.getElementById('max_'+i).value||g.max,
  }));
  const fixedIngr=FIXED_ITEMS.map((f,i)=>({...f,
    price:+(document.getElementById('fprice_'+i)||{}).value||0,
    pct:+(document.getElementById('fpct_'+i)||{value:f.pct}).value||f.pct,
  }));
  const fixedTotalPct=fixedIngr.reduce((s,f)=>s+f.pct,0);
  const freeTotal=100-fixedTotalPct;
  const fixedCost=fixedIngr.reduce((s,f)=>s+f.price*f.pct,0);
  const req={
    ME:    +document.getElementById('req_ME').value,
    CP:    +document.getElementById('req_CP').value,
    Lys:   +document.getElementById('req_Lys').value,
    MC:    +document.getElementById('req_MC').value,
    Ca_min:+document.getElementById('req_Ca_min').value,
    Ca_max:+document.getElementById('req_Ca_max').value,
    Pa:    +document.getElementById('req_Pa').value,
  };

  const n=ingr.length;
  // c: cost
  const c=ingr.map(g=>g.price);

  // A_le, b_le: <= constraints
  // 1. x_i <= max_i
  const A_le=[]; const b_le=[];
  for(let i=0;i<n;i++){
    const row=new Array(n).fill(0); row[i]=1;
    A_le.push(row); b_le.push(ingr[i].max);
  }
  // 2. Ca <= Ca_max  (باید مثلِ همه‌ی مغذی‌های دیگه ×۱۰۰ بشه، وگرنه این سقف عملاً نزدیکِ صفر می‌شه
  // و همیشه با کف/حداقلِ کلسیم که خودش ×۱۰۰ شده در تناقض می‌افته — همون چیزی که باعثِ «غیرِقابلِ‌تأمین» همیشگی می‌شد)
  const rowCaMax=ingr.map(g=>g.Ca); A_le.push(rowCaMax); b_le.push(req.Ca_max*100);
  // 3. sum <= FREE_TOTAL (for equality, also have >= below)
  A_le.push(new Array(n).fill(1)); b_le.push(freeTotal);

  // A_ge, b_ge: >= constraints
  const A_ge=[]; const b_ge=[];
  // x_i >= min_i
  for(let i=0;i<n;i++){
    const row=new Array(n).fill(0); row[i]=1;
    A_ge.push(row); b_ge.push(ingr[i].min);
  }
  // ME >= req.ME ,  CP >= req.CP ,  Lys >= req.Lys , ...
  // همه‌ی مغذی‌ها: sum(N_i * x_i / 100) >= نیاز → sum(N_i * x_i) >= نیاز × ۱۰۰  (چون x_i درصده)
  A_ge.push(ingr.map(g=>g.ME)); b_ge.push(req.ME*100);
  A_ge.push(ingr.map(g=>g.CP)); b_ge.push(req.CP*100);   // CP
  A_ge.push(ingr.map(g=>g.Lys)); b_ge.push(req.Lys*100); // Lys
  A_ge.push(ingr.map(g=>g.MC)); b_ge.push(req.MC*100);   // MC
  A_ge.push(ingr.map(g=>g.Ca)); b_ge.push(req.Ca_min*100); // Ca_min
  A_ge.push(ingr.map(g=>g.Pa)); b_ge.push(req.Pa*100);   // Pa
  // sum >= FREE_TOTAL (equality with A_le above)
  A_ge.push(new Array(n).fill(1)); b_ge.push(freeTotal);

  const solver=new LP();
  const res=solver.solve(c, A_le,b_le, A_ge,b_ge, [],[]);

  if(res.status!=='optimal'){
    document.getElementById('resultArea').innerHTML=`
      <div class="error-box">
        ⚠️ جیره قابل تأمین نیست<br>
        <small style="font-weight:400">محدودیت‌های تغذیه‌ای با این مواد اولیه برآورده نمی‌شود.<br>
        حداکثر مواد اولیه را بیشتر کنید یا محدودیت‌ها را کاهش دهید.</small>
      </div>`;
    return;
  }

  const x=res.x; // percentages of free ingredients
  // compute nutritional values
  const ME_r  = x.reduce((s,xi,i)=>s+ingr[i].ME*xi,0)/100;
  const CP_r  = x.reduce((s,xi,i)=>s+ingr[i].CP*xi,0)/100;
  const Lys_r = x.reduce((s,xi,i)=>s+ingr[i].Lys*xi,0)/100;
  const MC_r  = x.reduce((s,xi,i)=>s+ingr[i].MC*xi,0)/100;
  const Ca_r  = x.reduce((s,xi,i)=>s+ingr[i].Ca*xi,0)/100;
  const Pa_r  = x.reduce((s,xi,i)=>s+ingr[i].Pa*xi,0)/100;
  const cost_per_100kg = x.reduce((s,xi,i)=>s+ingr[i].price*xi,0) + fixedCost;
  const cost_ton = cost_per_100kg * 10;

  // show results
  const fmtN=v=>v.toLocaleString('fa-IR',{maximumFractionDigits:1});
  const fmtP=v=>v.toLocaleString('fa-IR',{maximumFractionDigits:2});
  const fmtC=v=>Math.round(v).toLocaleString('fa-IR');

  // formula rows (only ingredients with x > 0.01)
  const formulaRows = ingr.map((g,i)=>({name:g.name,pct:x[i]}))
    .concat(fixedIngr.map(f=>({name:f.name,pct:f.pct})))
    .filter(r=>r.pct>0.01)
    .sort((a,b)=>b.pct-a.pct);

  const totalCheck = x.reduce((s,v)=>s+v,0) + FIXED.reduce((s,f)=>s+f.pct,0);

  function nutrCard(label, val, req, unit, isLE=false){
    const ok = isLE ? val<=req+1e-4 : val>=req-1e-4;
    return `<div class="nutr-item ${ok?'ok':'bad'}">
      <div class="nv">${fmtP(val)}</div>
      <div class="nr">${isLE?'≤':'≥'} ${req} ${unit}</div>
      <div class="nn">${label}</div>
    </div>`;
  }

  document.getElementById('resultArea').innerHTML = `
    <div class="result-hdr">
      <h2>📊 نتیجه جیره‌نویسی</h2>
      <div class="cost">${fmtC(cost_ton)} <span>تومان/تن</span></div>
      <div class="badge">جمع کل: ${fmtP(totalCheck)}٪</div>
    </div>
    <div class="formula-card">
      <div class="ctitle" style="margin-bottom:8px">📋 فرمول جیره</div>
      ${formulaRows.map(r=>`
        <div class="formula-row">
          <span class="formula-name">${r.name}</span>
          <div class="formula-bar-wrap"><div class="formula-bar" style="width:${r.pct/FREE_TOTAL*100}%"></div></div>
          <span class="formula-pct">${fmtP(r.pct)}٪</span>
        </div>`).join('')}
    </div>
    <div class="nutr-grid">
      ${nutrCard('ME (kcal/kg)', ME_r, req.ME, '', false)}
      ${nutrCard('پروتئین خام%', CP_r, req.CP, '', false)}
      ${nutrCard('لیزین%', Lys_r, req.Lys, '', false)}
      ${nutrCard('Met+Cys%', MC_r, req.MC, '', false)}
      ${nutrCard('کلسیم%', Ca_r, req.Ca_min, '', false)}
      ${nutrCard('فسفر قابل%', Pa_r, req.Pa, '', false)}
    </div>
    <div class="card" style="margin-top:10px">
      <p class="hint" style="text-align:right;color:var(--muted);line-height:1.7;font-size:11px">
        ⚠️ این جیره بر اساس داده‌های استاندارد محاسبه شده.<br>
        قبل از استفاده با متخصص تغذیه دام تأیید شود.<br>
        مواد اولیه: ارزش‌های تغذیه‌ای INRA/NRC — سویه روس ۳۰۸
      </p>
    </div>
  `;
  document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
}
