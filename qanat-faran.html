// شمارهٔ چرخهٔ نوبتِ همین الان رو برمی‌گردونه (برای محاسبهٔ چرخش نوبت بیرون از تب نوبت آبیاری هم لازمه)
function getCurrentCycleIndex(){
  const entries = buildScheduleEntries();
  const now = new Date();
  const idx = entries.findIndex(e => now >= e.start && now < e.end);
  if(idx >= 0) return entries[idx].cycleIndex;
  return entries.length ? entries[entries.length-1].cycleIndex : 0;
}

function buildScheduleEntries(){
  const now = new Date();
  const [curJy] = gregorianToJalali(now.getFullYear(), now.getMonth()+1, now.getDate());
  const [gy0, gm0, gd0] = jalaliToGregorian(curJy, SCHEDULE_START_JALALI.m, SCHEDULE_START_JALALI.d);
  let cursor = new Date(gy0, gm0-1, gd0, SCHEDULE_START_JALALI.h, SCHEDULE_START_JALALI.min, 0);

  const [egy, egm, egd] = jalaliToGregorian(curJy, SCHEDULE_END_MONTH + 1, 1); // آغاز بهمن = پایان بازه
  const endDate = new Date(egy, egm-1, egd, 0, 0, 0);

  const entries = [];
  let cycleIndex = 0;
  let safety = 0;
  while (cursor < endDate && safety < 4000){
    for (let posIdx = 0; posIdx < 8; posIdx++){
      const groupIdx = turnOrder[posIdx];
      const start = new Date(cursor);
      const durMin = GROUP_DURATIONS_MIN[groupIdx];
      const end = new Date(start.getTime() + durMin*60000);
      entries.push({ groupIdx, start, end, cycleIndex });
      cursor = end;
      safety++;
      if (cursor >= endDate) break;
    }
    cycleIndex++;
  }
  return entries;
}

// اسم واقعیِ کسی که این چرخه (نوبت مشخص) باید آب ببره رو برمی‌گردونه — اگه چرخشی نباشه همون مالک ثابته،
// اگه چرخشی باشه، بر اساس شمارهٔ چرخه بین اسامی تعریف‌شده می‌چرخه
function effectiveOwnerForCycle(r, cycleIndex){
  const rot = r.rotation;
  if(!rot || !Array.isArray(rot.names) || rot.names.length < 2) return r.owner;
  const interval = Math.max(1, Number(rot.intervalCycles) || 1);
  const period = rot.names.length;
  const idx = Math.floor((cycleIndex||0) / interval) % period;
  return rot.names[idx] || r.owner;
}

// مثل effectiveOwnerForCycle ولی برای «چرخش آبیار»: وقتی خودِ آبیارِ یه ردیف (نه صاحبش) بین چند نفر می‌چرخه —
// مثلاً یه ساعتِ مشخص این چرخه دستِ یه آبیار باشه، چرخهٔ بعد دستِ یه آبیار دیگه
function effectiveDelegateForCycle(r, cycleIndex){
  const rot = r.delegateRotation;
  if(!rot || !Array.isArray(rot.names) || rot.names.length < 2) return (r.delegateName||'').trim();
  const interval = Math.max(1, Number(rot.intervalCycles) || 1);
  const period = rot.names.length;
  const idx = Math.floor((cycleIndex||0) / interval) % period;
  return (rot.names[idx] || r.delegateName || '').trim();
}

// اگه برای این جوی یه «گروه چرخشی آبیار» تعریف شده باشه، ترتیب ردیف‌هایی که به اعضای اون گروه سپرده شدن رو
// بر اساس چرخهٔ فعلی جابجا می‌کنه — یعنی این چرخه همهٔ نوبت‌های آبیار اول، بعد آبیار دوم، ...؛ چرخهٔ بعد ترتیب می‌چرخه
// ترتیب چرخشی آبیاران رو برای یه چرخهٔ مشخص حساب می‌کنه — الگو: این چرخه ترتیب عادی، چرخهٔ بعد کاملاً برعکس، چرخهٔ بعدش دوباره عادی، و ...
// (نه چرخش قطاری؛ دقیقاً همون الگویی که بین آبیاران قرار بود: این هفته من-رحمت-مظاهر، هفتهٔ بعد مظاهر-رحمت-من)
function rotatedDelegateOrder(names, cycleIndex, intervalCycles){
  const interval = Math.max(1, Number(intervalCycles)||1);
  const stepIndex = Math.floor((cycleIndex||0) / interval);
  const isReversed = stepIndex % 2 === 1;
  return isReversed ? names.slice().reverse() : names.slice();
}

// اگه یه جوی چند تا «گروه چرخشیِ آبیار» جداگانه داشته باشه (هرکدوم مالِ یه دستهٔ متفاوت از آبیارها)،
// همه‌شون رو پشتِ‌سرِ هم اعمال می‌کنیم — نه فقط اولی. چون هر گروه فقط رو ردیف‌های خودش (که به اعضای
// همون گروه سپرده شدن) اثر می‌ذاره، اعمالِ چندتا گروهِ جدا با هم مشکلی نداره
function applyDelegateRotation(groupIdx, rows, cycleIndex){
  const groups = rotationGroups.filter(g => g.jooyIndexes.length === 1 && g.jooyIndexes[0] === groupIdx && Array.isArray(g.names) && g.names.length >= 2);
  if(!groups.length) return rows;
  let result = rows;
  groups.forEach(group => { result = applyDelegateRotationForGroup(group, result, cycleIndex); });
  return result;
}

// هستهٔ مشترک چرخش آبیاران: ردیف‌های سپرده‌شده به اعضای گروه رو، همون جایگاه‌های زمانی قبلی رو نگه می‌داره
// ولی محتوای‌شون رو بر اساس ترتیب چرخشی این چرخه جابجا می‌کنه — پشت‌سرهم بودن نوبت هر آبیار همینه
function applyDelegateRotationForGroup(group, rows, cycleIndex){
  const names = group.names;
  const rotatedNames = rotatedDelegateOrder(names, cycleIndex, group.intervalCycles);
  // مهم: قبلاً این‌جا فقط دنبالِ کسی می‌گشت که رسماً «واگذار» شده بود (delegateName)؛ اگه اعضای
  // گروهِ چرخشی خودشون مستقیم مالکِ ردیف بودن (نه واگذارشده)، هیچ‌وقت پیدا نمی‌شدن و کل گروه بی‌اثر
  // می‌موند، بدون هیچ خطایی. الان اگه رکورد واگذاری نداشته باشه، خودِ اسمِ مالک هم چک می‌شه.
  const identity = r => effectiveDelegateForCycle(r, cycleIndex) || r.owner;

  const positions = [];
  rows.forEach((r,i) => { if(names.includes(identity(r))) positions.push(i); });
  if(positions.length === 0) return rows;

  const byDelegate = {};
  names.forEach(n => byDelegate[n] = []);
  positions.forEach(i => {
    const dn = identity(rows[i]);
    byDelegate[dn].push(rows[i]);
  });

  const newSeq = [];
  rotatedNames.forEach(n => { (byDelegate[n]||[]).forEach(r => newSeq.push(r)); });

  const result = rows.slice();
  positions.forEach((pos, idx) => {
    let r = newSeq[idx];
    const resolvedName = identity(r);
    // چون این ردیف الان عضوِ فعالِ یه گروه چرخشیه، همیشه با استایلِ آبیار (آبی + دستِ‌مصافحه) نشون
    // داده بشه — چه از قبل واگذاریِ رسمی داشته باشه چه نه؛ همینکه تو یه چرخشه یعنی این نکته مهمه.
    // مدتِ دستی (اگه تعریف شده) دیگه اینجا رو سرجه اثر نمی‌ذاره — مستقیم به‌عنوانِ دقیقهٔ مطلق
    // توسطِ distributePersonSlots اعمال می‌شه؛ سرجهٔ خودِ ردیف دست‌نخورده می‌مونه.
    // partnerNames یعنی «این آدم با کیا تو این گروه نوبتی می‌کنه» — تا تو نمایش صریح نشون داده بشه.
    r = { ...r, delegateName: resolvedName, partnerNames: names.filter(n => n !== resolvedName) };
    result[pos] = r;
  });
  return result;
}

// بر اساس ترتیب و مقدار سرجهٔ افراد در همون گروه، نوبت داخلی هر شخص را در بازهٔ زمانی جوی محاسبه می‌کند
// وقتی برای یه آبیار «ساعتِ شروعِ دستی» تعریف شده، اولین لحظه‌ای که اون ساعت (از روی همون نقطه‌ای
// که به‌طور طبیعی باید شروع بشه، نه قبل‌ترش) اتفاق می‌افته رو پیدا می‌کنه — یعنی اگه ساعتِ خواسته‌شده
// از ساعتِ فعلیِ نشونگر گذشته، همون امروز؛ اگه رد شده، فردا
function nextTimeOfDay(afterDate, hh, mm){
  const d = new Date(afterDate);
  d.setHours(hh, mm, 0, 0);
  if(d.getTime() < afterDate.getTime()) d.setDate(d.getDate()+1);
  return d;
}

// هستهٔ مشترکِ محاسبهٔ نوبتِ تک‌تکِ افراد — هم برای یه‌جوییِ تکی، هم برای نوبتِ ترکیبیِ چندجویی
// استفاده می‌شه. اگه برای یکی از افراد (از طریقِ یه گروه چرخشی) «ساعتِ شروعِ دستی» تعریف شده باشه،
// کل بازه رو به قطعه‌ها می‌شکونه: هر قطعه از یه نقطهٔ شروعِ مشخص (طبیعی یا دستی) تا قطعهٔ بعدی
// ادامه داره؛ داخلِ هر قطعه، زمان بینِ افرادِ همون قطعه به‌نسبتِ سرجهٔ خودشون تقسیم می‌شه.
function distributePersonSlots(rows, startDate, endDate, cycleIndex, startOverride, durationOverride){
  if(!rows.length) return [];
  const totalMs = endDate.getTime() - startDate.getTime();
  const so = startOverride || {};
  const durO = durationOverride || {};
  const identity = r => effectiveDelegateForCycle(r, cycleIndex) || r.owner;

  const segments = [];
  let cur = { rows: [], startMs: startDate.getTime() };
  let naturalCursor = new Date(startDate.getTime());
  const totalSarjehAll = rows.reduce((s,rr)=>s+(Number(rr.amount)||0),0) || 1;
  rows.forEach((r, i) => {
    const pin = so[identity(r)];
    if(pin && i > 0){
      const [hh,mm] = pin.split(':').map(Number);
      const pinDate = nextTimeOfDay(naturalCursor, hh, mm);
      segments.push(cur);
      cur = { rows: [], startMs: pinDate.getTime() };
    }
    cur.rows.push(r);
    naturalCursor = new Date(naturalCursor.getTime() + (Number(r.amount||0)/totalSarjehAll)*totalMs);
  });
  segments.push(cur);

  const slots = [];
  segments.forEach((seg, si) => {
    const segEndMs = (si+1 < segments.length) ? segments[si+1].startMs : endDate.getTime();
    const segTotalMs = Math.max(0, segEndMs - seg.startMs);
    // مدتِ دستیِ دقیقه‌ای (اگه برای کسی تعریف شده) مستقیم و ثابت کنار گذاشته می‌شه — نه یه سهمِ
    // نسبی از کل، بلکه دقیقاً همون عددی که وارد شده. بقیهٔ زمانِ این قطعه (بعد از کم‌کردنِ مدت‌های
    // دستی) بینِ نفراتِ بدونِ مدتِ دستی، به‌نسبتِ سرجهٔ خودشون، تقسیم می‌شه.
    const fixedTotalMs = seg.rows.reduce((s,r) => {
      const fixedMin = durO[identity(r)];
      return s + (fixedMin != null ? fixedMin*60000 : 0);
    }, 0);
    const remainingMs = Math.max(0, segTotalMs - fixedTotalMs);
    const segNormalSarjeh = seg.rows.reduce((s,r) => durO[identity(r)] == null ? s + (Number(r.amount)||0) : s, 0);
    let cursorMs = seg.startMs;
    seg.rows.forEach(r => {
      const fixedMin = durO[identity(r)];
      const shareMs = fixedMin != null
        ? fixedMin*60000
        : (segNormalSarjeh > 0 ? (Number(r.amount||0)/segNormalSarjeh) * remainingMs : 0);
      const start = new Date(cursorMs);
      const end = new Date(cursorMs + shareMs);
      const isRotating = !!(r.rotation && Array.isArray(r.rotation.names) && r.rotation.names.length >= 2);
      const effectiveOwner = isRotating ? effectiveOwnerForCycle(r, cycleIndex) : r.owner;
      const nextOwner = isRotating ? effectiveOwnerForCycle(r, cycleIndex + Math.max(1, Number(r.rotation.intervalCycles)||1)) : null;
      slots.push({ id:r.id, owner:r.owner, effectiveOwner, isRotating, nextOwner, amount:r.amount, start, end, delegateName:effectiveDelegateForCycle(r, cycleIndex), jooyIndex:r.jooyIndex, partnerNames:r.partnerNames||[] });
      cursorMs += shareMs;
    });
  });
  return slots;
}

// بر اساس ترتیب و مقدار سرجهٔ افراد در همون گروه، نوبت داخلی هر شخص را در بازهٔ زمانی جوی محاسبه می‌کند
function computePersonSlots(entry){
  let rows = state.records.filter(r=>r.jooyIndex===entry.groupIdx).sort((a,b)=>a.row-b.row);
  rows = applyDelegateRotation(entry.groupIdx, rows, entry.cycleIndex);
  // «ساعتِ شروع» و «مدتِ دستی»ای که تو گروه‌های چرخشیِ همین جوی تعریف شده باشه رو جمع می‌کنیم
  const relevantGroups = rotationGroups.filter(g => g.jooyIndexes.length === 1 && g.jooyIndexes[0] === entry.groupIdx);
  const startOverride = {};
  const durationOverride = {};
  relevantGroups.forEach(g => {
    Object.assign(startOverride, g.startOverride||{});
    Object.assign(durationOverride, g.durationOverride||{});
  });
  return distributePersonSlots(rows, entry.start, entry.end, entry.cycleIndex, startOverride, durationOverride);
}

// لیبل نمایشی برای یه نوبت ترکیبی (چند جوی پشت‌سرهم که آبِ آبیارانش با هم یک نوبت پیوسته حساب شده)
function mergedGroupLabel(jooyIndexes){
  return jooyIndexes.map(gi => groupLabel(gi)).join(' + ');
}

// نسخهٔ رده‌بندی‌شدهٔ buildScheduleEntries: هر جا چند جوی پشت‌سرهم به یه «گروه چرخشی چند‌جویی» سپرده شده باشن،
// اون چند ورودی رو در یک نوبتِ ترکیبیِ پیوسته ادغام می‌کنه (شروع = شروع اولین جوی، پایان = پایان آخرین جوی)
function buildDisplayEntries(rawEntries){
  const multiGroups = rotationGroups.filter(g => g.jooyIndexes.length >= 2 && Array.isArray(g.names) && g.names.length >= 2);
  const customGroups = customSchedules.filter(c => Array.isArray(c.jooyIndexes) && c.jooyIndexes.length >= 1 && Array.isArray(c.weeks) && c.weeks.some(w => w.length));
  if(!multiGroups.length && !customGroups.length) return rawEntries;

  const matchesSeq = (jooyIndexes, i, cycleIndex) => {
    const n = jooyIndexes.length;
    if(i + n > rawEntries.length) return false;
    for(let k=0;k<n;k++){
      if(rawEntries[i+k].groupIdx !== jooyIndexes[k]) return false;
      if(rawEntries[i+k].cycleIndex !== cycleIndex) return false;
    }
    return true;
  };

  const result = [];
  let i = 0;
  while(i < rawEntries.length){
    const e = rawEntries[i];
    // اگه هم یه برنامهٔ سفارشی و هم یه گروهِ چرخشیِ خودکار از همین نقطه شروع بشن، اونی که جوی‌های
    // بیشتری رو پوشش می‌ده (یعنی مشخص‌تر و کامل‌تره) اولویت داره — نه صرفاً هرکدوم اول پیدا شد.
    // قبلاً یه برنامهٔ سفارشیِ تک‌جویی همیشه جلوی یه گروهِ چرخشیِ چندجویی رو می‌گرفت، حتی وقتی گروه
    // بزرگ‌تر و دقیقاً منظورِ کاربر بود — چون این‌جا فقط چک می‌شد کدوم اول پیدا شد، نه کدوم کامل‌تره.
    const customMatch = customGroups.find(c => matchesSeq(c.jooyIndexes, i, e.cycleIndex));
    const rotationMatch = multiGroups.find(g => matchesSeq(g.jooyIndexes, i, e.cycleIndex));
    const useCustom = customMatch && (!rotationMatch || customMatch.jooyIndexes.length >= rotationMatch.jooyIndexes.length);
    const match = useCustom ? null : rotationMatch;
    if(useCustom){
      const n = customMatch.jooyIndexes.length;
      const subEntries = rawEntries.slice(i, i+n);
      result.push({
        merged: true,
        customSchedule: customMatch,
        jooyIndexes: customMatch.jooyIndexes,
        groupIdx: customMatch.jooyIndexes[0],
        subEntries,
        start: subEntries[0].start,
        end: subEntries[subEntries.length-1].end,
        cycleIndex: e.cycleIndex,
      });
      i += n;
    } else if(match){
      const n = match.jooyIndexes.length;
      const subEntries = rawEntries.slice(i, i+n);
      result.push({
        merged: true,
        rotationGroup: match,
        jooyIndexes: match.jooyIndexes,
        groupIdx: match.jooyIndexes[0],
        subEntries,
        start: subEntries[0].start,
        end: subEntries[subEntries.length-1].end,
        cycleIndex: e.cycleIndex,
      });
      i += n;
    } else {
      result.push(e);
      i += 1;
    }
  }
  return result;
}

// مثل computePersonSlots ولی برای نوبت ترکیبیِ چندجویی: همهٔ ردیف‌های همهٔ جوی‌های این نوبت رو
// پشت‌سرهم (به ترتیب جوی، بعد ردیف) روی هم می‌ریزه، چرخش آبیاران رو روی کل مجموعه اعمال می‌کنه،
// و بازهٔ زمانیِ کل رو متناسب با سرجهٔ هرکس تقسیم می‌کنه — نتیجه: نوبت هر آبیار پیوسته و یکجا میاد
function computeMergedPersonSlots(mergedEntry){
  let rows = [];
  mergedEntry.subEntries.forEach(sub => {
    const jooyRows = state.records.filter(r=>r.jooyIndex===sub.groupIdx).sort((a,b)=>a.row-b.row);
    rows = rows.concat(jooyRows);
  });
  rows = applyDelegateRotationForGroup(mergedEntry.rotationGroup, rows, mergedEntry.cycleIndex);
  if(!rows.length) return [];
  const startOverride = (mergedEntry.rotationGroup && mergedEntry.rotationGroup.startOverride) || {};
  const durationOverride = (mergedEntry.rotationGroup && mergedEntry.rotationGroup.durationOverride) || {};
  return distributePersonSlots(rows, mergedEntry.start, mergedEntry.end, mergedEntry.cycleIndex, startOverride, durationOverride);
}

// نوبتِ همین الان رو، چه ساده چه ترکیبی، محاسبه می‌کنه
// برای «گروه چرخشی سفارشی»: به‌جای محاسبهٔ خودکار از روی سرجه، دقیقاً همون ترتیب و ساعتی که خودت
// برای هفتهٔ فرد/زوج تعریف کردی رو پشت‌سرهم از شروعِ نوبت می‌چینه — اگه جمعِ ساعت‌ها از کل زمانِ
// واقعیِ این جوی(ها) بیشتر بشه، همون‌جا قطع می‌شه (فراتر از زمان فیزیکیِ جوی نمی‌ره)
// «گروه چرخشی سفارشی»: به‌جای اینکه افرادِ دستی‌چیده‌شده رو اول بچینه و بقیه رو بعدش، الان کل ترتیبِ
// طبیعیِ ردیف‌ها (همون ترتیبی که تو تب سرجه‌ها هست) رو حفظ می‌کنه — فقط مدتِ زمانِ کسی که تو این چرخهٔ
// خاص دستی مشخص شده رو با همون مقدارِ ثابتی که خودت دادی جایگزین می‌کنه، بقیه سرِ جای طبیعیِ خودشون می‌مونن
function computeCustomScheduleSlots(entry){
  const sched = entry.customSchedule;
  const weeks = sched.weeks.filter(w => Array.isArray(w));
  if(!weeks.length) return [];
  const weekIdx = (entry.cycleIndex||0) % weeks.length;
  const week = weeks[weekIdx] || [];
  const startMs = entry.start.getTime();
  const endMs = entry.end.getTime();

  // هرکسی که تو هر کدوم از چرخه‌های این گروه (نه فقط همین چرخه) دستی چیده شده، عضوِ همون گروهِ ترکیبیه —
  // مثلاً اگه محمود و ابوالحسن با هم آبشون یکی شده و چرخه‌های ۱و۲ مالِ محمود، چرخهٔ ۳ مالِ ابوالحسنه،
  // تو چرخه‌های ۱و۲ نباید ابوالحسن دوباره جدا و اضافه نشون داده بشه — آبش همون لحظه پیشِ محموده
  const namedAnywhere = new Set(weeks.flatMap(w => w.map(x => x.name)));

  const jooyIndexesForGroup = entry.jooyIndexes || (entry.groupIdx!=null ? [entry.groupIdx] : []);
  let rows = [];
  jooyIndexesForGroup.forEach(gi => {
    rows = rows.concat(state.records.filter(r => r.jooyIndex === gi).sort((a,b)=>a.row-b.row));
  });
  if(!rows.length) return [];

  // برای هر ردیف، «هویتِ»ش رو بر اساس همون قانونِ همیشگی تعیین می‌کنیم (آبیارِ چرخشیِ همین چرخه، وگرنه خودِ مالک)
  const identityOf = r => effectiveDelegateForCycle(r, entry.cycleIndex) || r.owner;
  const defaultJooyIndex = jooyIndexesForGroup[0];

  // گروه‌های چرخشیِ سفارشیِ دیگه که جوی‌هاشون زیرمجموعهٔ همینه یا حتی دقیقاً همون جوی(ها)‌ست — مثلاً
  // یه گروهِ جداگانه فقط برای «حاج محمدباقر» داخلِ گروهِ بزرگ‌ترِ «عرب + حاج محمدباقر»، یا دو گروهِ
  // سفارشیِ کاملاً جدا که هر دو دقیقاً روی همون یه جوی (مثلاً طورانیها) تعریف شدن. قبلاً این‌جور
  // گروه‌های اضافه اصلاً دیده نمی‌شدن — فقط گروهی که اول با یه جوی مچ می‌شد اثر می‌ذاشت و بقیه‌ی
  // گروه‌های روی همون جوی(ها) کاملاً نادیده گرفته می‌شدن. الان هرکدوم جداگانه محاسبه و با چرخشِ
  // خودش (بر اساسِ همون شمارهٔ چرخهٔ کلی) جایگزینِ ردیف‌های مربوط به خودش می‌شه.
  const nestedSchedules = customSchedules.filter(cs =>
    cs.id !== sched.id &&
    cs.jooyIndexes.length &&
    cs.jooyIndexes.every(gi => jooyIndexesForGroup.includes(gi))
  ).map(cs => {
    const csWeeks = cs.weeks.filter(w => Array.isArray(w));
    if(!csWeeks.length) return null;
    const csWeekIdx = (entry.cycleIndex||0) % csWeeks.length;
    return { sched: cs, week: csWeeks[csWeekIdx] || [], namedAnywhere: new Set(csWeeks.flatMap(w => w.map(x => x.name))) };
  }).filter(Boolean);

  // برای هر ردیف تعیین می‌کنیم عضوِ کدوم «بلوکِ رزروشده»ست: خودِ همین گروه، یکی از گروه‌های تودرتو، یا هیچ‌کدوم
  const blockOfRow = r => {
    const id = identityOf(r);
    if(namedAnywhere.has(id)) return { key:'main' };
    for(const ns of nestedSchedules){ if(ns.namedAnywhere.has(id)) return { key:`nested-${ns.sched.id}`, nested: ns }; }
    return null;
  };

  // مهم: کلِ بلوکِ اعضای هر گروه (اصلی یا تودرتو) باید سرِ جای خودش (بین بقیهٔ مالکینِ همون جوی، طبق
  // ترتیبِ ردیف‌ها تو تب سرجه‌ها) بمونه — نه همیشه اولِ صف. اما داخلِ خودِ هر بلوک، ترتیب دقیقاً همونیه
  // که تو همون گروه تایپ شده (نه بر اساسِ ردیفِ تکِ‌تکِ افراد).
  const flushedBlocks = new Set();
  const orderedItems = [];
  rows.forEach((r, idx) => {
    const block = blockOfRow(r);
    if(!block){ orderedItems.push({ type:'normal', row:r }); return; }
    if(flushedBlocks.has(block.key)) return; // این بلوک قبلاً یه‌جا حساب شده
    flushedBlocks.add(block.key);
    const itemsThisWeek = block.key === 'main' ? week : block.nested.week;
    itemsThisWeek.forEach(item => orderedItems.push({ type:'custom', item, sourceId: block.key === 'main' ? sched.id : block.nested.sched.id, sourceSched: block.key === 'main' ? sched : block.nested.sched }));
  });
  // اگه هیچ‌کدوم از اعضای گروهِ اصلی اصلاً ردیفِ خودشون رو تو این جوی نداشتن (مثلاً همه‌شون آبیارِ
  // کاملاً بیرونی‌ان)، جای رزروشده‌ای پیدا نشد — پس آیتم‌های این هفته رو همون اولِ صف می‌ذاریم
  if(!flushedBlocks.has('main') && week.length){
    orderedItems.unshift(...week.map(item => ({ type:'custom', item, sourceId: sched.id, sourceSched: sched })));
  }

  const slots = [];
  let cursorMs = startMs;
  const placedNames = new Set();
  orderedItems.forEach(entryItem => {
    if(cursorMs >= endMs) return;
    if(entryItem.type === 'custom'){
      const item = entryItem.item;
      if(placedNames.has(item.name)) return; // یه اسم دوبار تو یه چرخه نیاد
      placedNames.add(item.name);
      const durMs = Math.max(0, Number(item.hours)||0) * 3600000;
      const start = new Date(cursorMs);
      const end = new Date(Math.min(cursorMs + durMs, endMs));
      // این آیتم دقیقاً کدوم «جایگاه» (شمارهٔ ردیف) تو چرخهٔ خودشه رو پیدا می‌کنیم، تا اسمِ همون
      // جایگاه رو تو بقیهٔ چرخه‌های همین گروه هم بیاریم — یعنی «با کی نوبتی می‌کنه»
      const srcSched = entryItem.sourceSched;
      const srcWeeks = srcSched ? srcSched.weeks.filter(w => Array.isArray(w)) : [];
      const srcWeekIdx = srcWeeks.length ? (entry.cycleIndex||0) % srcWeeks.length : 0;
      const posInWeek = srcWeeks.length ? srcWeeks[srcWeekIdx].indexOf(item) : -1;
      const partnerNames = posInWeek !== -1
        ? srcWeeks.map((w,wi) => wi===srcWeekIdx ? null : (w[posInWeek] ? w[posInWeek].name : null)).filter(Boolean)
        : [];
      slots.push({
        id: `custom-${entryItem.sourceId}-${weekIdx}-${item.name}`,
        owner: item.name, effectiveOwner: item.name, isRotating:false, nextOwner:null,
        amount: (end.getTime()-start.getTime())/60000/16,
        // اینجا فقط یه فیلدِ اسم داریم (اسم آبیار/مالک)، پس delegateName رو خالی می‌ذاریم — وگرنه چون
        // owners[0] با delegateName یکی می‌شه، تو نمایش به‌شکلِ تکراریِ «🤝 فلانی (مالک: فلانی)» درمیاد.
        // isCustomManual باعث می‌شه پایین‌تر (buildPersonBlocks) بازم به‌رنگِ آبی و با آیکنِ دست نشون داده
        // بشه — دقیقاً هم‌شکلِ بقیهٔ نوبت‌ها. اسمِ مالکان هم خودکار از رکوردهایی که به این اسم واگذار
        // شدن جمع می‌شه (ownersForAabiarName) — لازم نیست دستی تایپ بشه، حتی اگه ۱۰ تا مالک داشته باشه.
        start, end, delegateName: '', isCustomManual: true, customOwnerText: ownersForAabiarName(item.name).join('، '), jooyIndex: defaultJooyIndex,
        sourceScheduleId: entryItem.sourceId, partnerNames,
      });
      cursorMs = end.getTime();
    } else {
      const r = entryItem.row;
      // هر سرجه = ۱۶ دقیقهٔ واقعیِ ثابت — دقیقاً مثلِ همه‌جای دیگهٔ برنامه
      const durMs = Math.max(0, Number(r.amount)||0) * 16 * 60000;
      const start = new Date(cursorMs);
      const end = new Date(Math.min(cursorMs + durMs, endMs));
      const isRotating = !!(r.rotation && Array.isArray(r.rotation.names) && r.rotation.names.length >= 2);
      const effectiveOwner = isRotating ? effectiveOwnerForCycle(r, entry.cycleIndex) : r.owner;
      const nextOwner = isRotating ? effectiveOwnerForCycle(r, entry.cycleIndex + Math.max(1, Number(r.rotation.intervalCycles)||1)) : null;
      slots.push({ id:r.id, owner:r.owner, effectiveOwner, isRotating, nextOwner, amount:r.amount, start, end, delegateName:effectiveDelegateForCycle(r, entry.cycleIndex), jooyIndex:r.jooyIndex, sourceScheduleId:null });
      cursorMs = end.getTime();
    }
  });
  // اگه جمعِ زمانِ همه با هم کمتر یا بیشتر از زمانِ فیزیکیِ این نوبت بود، به‌جای گم‌کردنِ بی‌صدای فاصله
  // (یا سرریز به نوبتِ بعدی)، به آخرین نفر اضافه/کوتاه می‌کنیم تا خلأ نیفته
  if(cursorMs !== endMs && slots.length) slots[slots.length-1].end = new Date(endMs);
  return slots;
}

function computeSlotsForEntry(entry){
  if(entry.customSchedule) return computeCustomScheduleSlots(entry);
  return entry.merged ? computeMergedPersonSlots(entry) : computePersonSlots(entry);
}

// ردیف‌های پشت‌سرهم که به یه آبیار سپرده شدن رو با هم یه بلوک واحد می‌کنه (به‌جای تکرار جدا جدا)،
// تا معلوم باشه نوبت هرکس دقیقاً از کِی تا کِیه — برای هر نوبتی (نه فقط نوبت الان) قابل استفاده‌ست
function buildPersonBlocks(entry){
  const slots = computeSlotsForEntry(entry);
  const blocks = [];
  slots.forEach((s, i) => {
    const dn = s.delegateName;
    const last = blocks[blocks.length - 1];
    if(dn && last && last.delegateName === dn){
      last.owners.push(s.owner);
      last.amount += Number(s.amount)||0;
      last.end = s.end;
      last.indices.push(i);
      if(!last.jooyIndexes.includes(s.jooyIndex)) last.jooyIndexes.push(s.jooyIndex);
    } else {
      blocks.push({
        delegateName: dn, owners: [s.owner], amount: Number(s.amount)||0,
        start: s.start, end: s.end, indices: [i], jooyIndexes: [s.jooyIndex],
        isRotating: s.isRotating, nextOwner: s.nextOwner, effectiveOwner: s.effectiveOwner,
        sourceScheduleId: s.sourceScheduleId, isCustomManual: s.isCustomManual, customOwnerText: s.customOwnerText,
      });
    }
  });
  return blocks;
}

// همهٔ گروه‌های چرخشیِ فعال روی این نوبت (اگه چندتا باشه، همه‌شون رو برمی‌گردونه)
function activeRotationGroupsForEntry(entry){
  if(entry.merged) return entry.rotationGroup ? [entry.rotationGroup] : [];
  return rotationGroups.filter(g => g.jooyIndexes.length === 1 && g.jooyIndexes[0] === entry.groupIdx && Array.isArray(g.names) && g.names.length >= 2);
}

// یادداشتِ ترتیب چرخش برای یه نوبت خاص (این چرخه و چرخهٔ بعد با تاریخ دقیق)
function groupNoteHtmlForEntry(entry, allEntries){
  if(entry.customSchedule){
    const sched = entry.customSchedule;
    const weeks = sched.weeks.filter(w => Array.isArray(w));
    if(!weeks.length) return '';
    const weekIdx = (entry.cycleIndex||0) % weeks.length;
    const week = weeks[weekIdx] || [];
    const nextWeekIdx = (weekIdx+1) % weeks.length;
    const nextWeek = weeks[nextWeekIdx] || [];
    const nextOccurrence = allEntries.find(e => e.customSchedule === sched && e.cycleIndex === (entry.cycleIndex||0) + 1);
    const nextDateNote = nextOccurrence ? ` (از <b style="color:var(--clay);">${jalaliDateLabel(nextOccurrence.start)} ${timeLabel(nextOccurrence.start)}</b>)` : '';
    const fmt = w => w.map(x => `${escapeHtml(x.name)} (${minutesToHourMinText((Number(x.hours)||0)*60)})`).join(' ⟵ ');
    return `<p class="loc-preview-hint" style="margin-bottom:8px;">📋 این نوبت با مدیریتِ گردشِ نوبت تنظیم شده — چرخهٔ ${toFaDigits(weekIdx+1)} از ${toFaDigits(weeks.length)} (از <b style="color:var(--clay);">${jalaliDateLabel(entry.start)}</b>): <b>${fmt(week)}</b><br>چرخهٔ بعد${nextDateNote}: ${fmt(nextWeek)}</p>`;
  }
  const activeGroups = activeRotationGroupsForEntry(entry);
  if(!activeGroups.length) return '';
  const noteFor = activeGroup => {
    const order = rotatedDelegateOrder(activeGroup.names, entry.cycleIndex, activeGroup.intervalCycles);
    const interval = Math.max(1, Number(activeGroup.intervalCycles)||1);
    const nextOrder = rotatedDelegateOrder(activeGroup.names, (entry.cycleIndex||0) + interval, activeGroup.intervalCycles);
    const nextOccurrence = allEntries.find(e =>
      (entry.merged ? (e.merged && e.rotationGroup === activeGroup) : (!e.merged && e.groupIdx === entry.groupIdx))
      && e.cycleIndex === (entry.cycleIndex||0) + interval
    );
    const nextDateNote = nextOccurrence ? ` (از <b style="color:var(--clay);">${jalaliDateLabel(nextOccurrence.start)} ${timeLabel(nextOccurrence.start)}</b>)` : '';
    // فقط یادداشتِ ترتیب و تاریخ — لیست کامل دورهٔ بعد رو اینجا تکرار نمی‌کنیم چون همون رکوردها خودشون
    // سرِ جای طبیعی‌شون (پایین‌تر تو لیست کلی) دوباره نشون داده می‌شن؛ تکرارشون اینجا فقط گیج‌کننده‌ست.
    return `🔄 این نوبت گروه چرخشی آبیار داره — ترتیب این چرخه (از <b style="color:var(--clay);">${jalaliDateLabel(entry.start)}</b>): <b>${order.map(escapeHtml).join(' ⟵ ')}</b><br>ترتیب چرخهٔ بعد${nextDateNote}: ${nextOrder.map(escapeHtml).join(' ⟵ ')}`;
  };
  return `<p class="loc-preview-hint" style="margin-bottom:8px;">${activeGroups.map(noteFor).join('<br><br>')}</p>`;
}

// لیستِ HTML بلوک‌های افراد برای یه نوبت خاص — هم برای «نوبت افراد الان» و هم برای بازکردنِ هر ردیف تو لیست کلی استفاده می‌شه
function renderPersonBlocksHtml(entry){
  let blocks = buildPersonBlocks(entry);
  if(!blocks.length) return '';
  const now = new Date();
  blocks = applyDelegateLoans(blocks, entry.cycleIndex);
  // همون دکمهٔ «نمایش جوی‌های گذشته» بالای صفحه، این‌جا هم اثر داره: وقتی بسته‌ست، فقط ۲ آبیارِ
  // گذشتهٔ درست قبل از «اکنون» نشون داده می‌شه (نه کل تاریخچه از اول همین نوبت)؛ وقتی باز بشه،
  // همهٔ آبیارهای قبلیِ همین جوی هم مثلِ جوی‌های دیگه کامل نشون داده می‌شن — یه دکمه، یه قانون یکسان.
  const currentIdx = blocks.findIndex(b => now >= b.start && now < b.end);
  if(!showPastCycles && currentIdx > 2){
    blocks = blocks.slice(currentIdx - 2);
  }
  return `
    <div class="sched-list">
      ${blocks.map(b => {
        const isCurrentBlock = now >= b.start && now < b.end;
        const isPastBlock = b.end <= now;
        // یه بلوکِ «آبیار» رو کامل به‌سبکِ آبی+دستِ‌مصافحه نشون می‌دیم اگه چند مالک با هم بهش سپرده شده
        // (مثلِ همیشه)، یا اگه خودش دقیقاً همون کسیه که آبِ ترکیبی‌ش رو گرفته (مثلِ گروه چرخشی سفارشی‌ای
        // که آبِ چند نفر رو یه‌جا به یه آبیار می‌ده) — تا این‌جور مالکینِ نوبت هم دقیقاً مثلِ بقیهٔ آبیارها بیان.
        // برای نوبت‌هایی که با «مدیریت گردش نوبت» تنظیم شدن (isCustomManual)، فقط یه اسم داریم و مالکِ
        // جدایی برای نشون‌دادن نیست، پس همون یه اسم رو آبی+دستِ‌مصافحه نشون می‌دیم، بدون خطِ «(مالک: ...)».
        const isDelegateBlock = b.delegateName && (b.owners.length > 1 || b.owners[0] === b.delegateName);
        const hourMin = minutesToHourMinText((b.end-b.start)/60000);
        const name = isDelegateBlock
          ? `<span style="color:var(--water-blue);font-weight:800;">🤝 ${escapeHtml(b.delegateName)}</span> <span class="sched-owner-sub">(مالک: ${b.owners.map(escapeHtml).join('، ')})</span>`
          : b.isCustomManual
          ? `<span style="color:var(--water-blue);font-weight:800;">🤝 ${escapeHtml(b.effectiveOwner)}</span>${b.customOwnerText ? ` <span class="sched-owner-sub">(مالک: ${escapeHtml(b.customOwnerText)})</span>` : ''}`
          : `${escapeHtml(b.effectiveOwner)}${b.isRotating ? ' <span style="color:#B8860B;" title="این نوبت چرخشیه">🔄</span>' : ''}${b.delegateName ? ` <span style="color:var(--water-blue);">🤝${escapeHtml(b.delegateName)}</span>` : ''}`;
        // ردیف‌های گذشته یه برچسبِ «گذشت» می‌گیرن — تا فرق نوبت‌های تموم‌شده از الان/بعداً روشن باشه
        const line = `${isCurrentBlock ? '<span class="sched-badge">اکنون</span> ' : isPastBlock ? '<span class="sched-badge sched-badge-past">گذشت</span> ' : ''}${name} ${b.amount} سرجه (${hourMin})`;
        const loanNote = b.loanGiven
          ? `<div class="loan-note loan-given">🔁 ${toFaDigits(b.loanGiven.minutes)} دقیقه قرض داده به ${escapeHtml(b.loanGiven.partner)}</div>`
          : b.loanReceived
          ? `<div class="loan-note loan-received">🔁 ${toFaDigits(b.loanReceived.minutes)} دقیقه قرض گرفته از ${escapeHtml(b.loanReceived.partner)}</div>`
          : '';
        const rowLoanClass = b.loanGiven ? 'loan-row-given' : b.loanReceived ? 'loan-row-received' : '';
        return `
        <div class="sched-row ${isCurrentBlock ? 'current' : ''} ${isPastBlock ? 'sched-row-past' : ''} ${rowLoanClass}">
          <div class="sched-left">
            <div class="sched-jooy">${line}</div>
            ${loanNote}
          </div>
          <div class="sched-time">
            <div>${timeLabel(b.start)} تا ${timeLabel(b.end)}</div>
            <div style="font-size:12px;font-weight:800;color:var(--clay);margin-top:1px;font-family:'Yekan','Vazirmatn',Tahoma,sans-serif;">${jalaliDateShort(b.start)}${jalaliDateShort(b.start)!==jalaliDateShort(b.end) ? ' ⟶ '+jalaliDateShort(b.end) : ''}</div>
            <div style="font-size:11px;font-weight:800;color:var(--clay);margin-top:1px;font-family:'Yekan','Vazirmatn',Tahoma,sans-serif;">${weekdayName(b.start)}${weekdayName(b.start)!==weekdayName(b.end) ? ' ⟶ '+weekdayName(b.end) : ''}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

// کدام ردیف‌های نوبت (تو لیست کلی) الان باز شدن، برای دیدن جزئیات نوبت هر آبیار/مالک با زدن روشون
let expandedScheduleKeys = new Set();
function toggleScheduleEntry(key){
  if(expandedScheduleKeys.has(key)) expandedScheduleKeys.delete(key);
  else expandedScheduleKeys.add(key);
  if(state.activeTab === 'schedule') renderSchedule();
}

// نمایش دوره‌های گذشته: پیش‌فرض مخفی، تا لیست شلوغ نشه؛ با دکمه می‌شه دوباره نشونشون داد
let showPastCycles = false;
function togglePastCycles(){
  showPastCycles = !showPastCycles;
  if(state.activeTab === 'schedule') renderSchedule();
}

function renderSchedule(){
  const view = document.getElementById('scheduleView');
  const entries = buildDisplayEntries(buildScheduleEntries());
  const now = new Date();
  const currentIdx = entries.findIndex(e => now >= e.start && now < e.end);
  const current = currentIdx >= 0 ? entries[currentIdx] : null;
  const entryLabel = (e) => `جوی ${e.merged ? mergedGroupLabel(e.jooyIndexes) : groupLabel(e.groupIdx)}`;

  // شناسهٔ ردیفی که همین الان نوبتشه (برای رنگ‌کردنِ کارت واگذاری‌ها که نوبتشونه)
  let liveRecordId = null;
  if(current){
    const liveSlots = computeSlotsForEntry(current);
    const liveSlot = liveSlots.find(s => now >= s.start && now < s.end);
    if(liveSlot) liveRecordId = liveSlot.id;
  }

  let nowCardHtml;
  let personSlotsHtml = '';
  let currentJooyDisplayLabel = null;
  if (current){
    const next = entries[currentIdx+1];
    const nextLine = next ? `
        <div class="next-line">نوبت بعدی: <b class="active-jooy-label">${escapeHtml(entryLabel(next))}</b> از ${relativeDayLabel(next.start, now)} ساعت ${timeLabel(next.start)}</div>` : '';

    const slots = computeSlotsForEntry(current);
    const nowSlotIdx = slots.findIndex(s => now >= s.start && now < s.end);
    const nowSlot = nowSlotIdx >= 0 ? slots[nowSlotIdx] : null;
    const personLine = nowSlot ? `
        <div class="next-line">نوبت شخص الان: <b>${escapeHtml(nowSlot.effectiveOwner)}</b>${nowSlot.isRotating ? ` <span style="color:#FBE38B;">🔄 چرخشی${nowSlot.effectiveOwner!==nowSlot.owner ? ` (اسم اصلی ردیف: ${escapeHtml(nowSlot.owner)})` : ''} — چرخهٔ بعد: ${escapeHtml(nowSlot.nextOwner)}</span>` : ''}${nowSlot.delegateName ? ` — 🤝 آبیار: <b>${escapeHtml(nowSlot.delegateName)}</b>` : ''} (${nowSlot.amount} سرجه، ${minutesToHourMinText((nowSlot.end-nowSlot.start)/60000)}) — از ${timeLabel(nowSlot.start)} تا ${timeLabel(nowSlot.end)}</div>` : '';

    // جویی که همین لحظه واقعاً از نظر فیزیکی داره جریان داره (نه کل بازهٔ نوبت گروهیِ چندجویی)
    const physicalNow = current.merged
      ? (current.subEntries.find(s => now >= s.start && now < s.end) || current.subEntries[0])
      : current;
    // خطِ «این جوی بخشی از نوبت پیوستهٔ گروهیه» فقط وقتی معنی داره که نوبتِ همین الان واقعاً دستِ
    // یکی از اعضای همون گروهِ چندجوییه (چه گروه چرخشیِ خودکار، چه گروه چرخشیِ سفارشی). وقتی نوبتِ
    // گروه تموم شد و به یه مالکِ عادیِ تکی (یا یه گروهِ تودرتوی کوچیک‌تر) رسید که فقط تو همین یه جوی
    // سهم داره، دیگه نباید اسمِ چندجوییِ لینک‌شده رو نشون بده — این قانون برای هر گروه/جوی یکسانه،
    // نه فقط یه مورد خاص، چون بر اساسِ خودِ داده (کدوم گروه واقعاً صاحبِ همین بلوکِ الانه) تصمیم می‌گیره.
    const isRotationGroupTurn = current.merged && current.rotationGroup && nowSlot
      && current.rotationGroup.names.includes(nowSlot.delegateName);
    const isCustomScheduleTurn = current.merged && current.customSchedule && nowSlot
      && nowSlot.sourceScheduleId === current.customSchedule.id;
    const isMultiJooyGroupTurn = isRotationGroupTurn || isCustomScheduleTurn;
    // همون منطقِ بالا رو برای عنوانِ «دورهٔ N» هم استفاده می‌کنیم: وقتی نوبتِ گروهه، اسمِ چندجوییِ
    // لینک‌شده؛ وقتی رد شده و به یه جویِ دیگه (یا یه زیرگروهِ تودرتو) رسیده، فقط اسمِ همون جویِ فیزیکیِ الان.
    currentJooyDisplayLabel = isMultiJooyGroupTurn ? entryLabel(current) : `جوی ${groupLabel(physicalNow.groupIdx)}`;
    const mergedNote = (current.merged && isMultiJooyGroupTurn) ? `
        <div class="next-line" style="border-top:none;margin-top:2px;padding-top:0;">🔗 این جوی بخشی از یه نوبت پیوستهٔ گروهیه: <b class="active-jooy-label">${escapeHtml(entryLabel(current))}</b> (از ${relativeDayLabel(current.start, now)} ${timeLabel(current.start)} تا ${relativeDayLabel(current.end, now)} ${timeLabel(current.end)})</div>` : '';

    nowCardHtml = `
      <div class="now-card">
        <div class="now-card-icon">💧</div>
        <div class="label">الان نوبت آب با:</div>
        <div class="jooy-name">جوی ${escapeHtml(groupLabel(physicalNow.groupIdx))}</div>
        <div class="range">${relativeDayLabel(physicalNow.start, now)} ${timeLabel(physicalNow.start)} تا ${relativeDayLabel(physicalNow.end, now)} ${timeLabel(physicalNow.end)}</div>
        ${mergedNote}
        ${personLine}
        ${nextLine}
      </div>`;

    if (slots.length){
      const groupNote = groupNoteHtmlForEntry(current, entries);
      personSlotsHtml = `
        <div class="cycle-block">
          <p class="cycle-title">نوبت افراد «${escapeHtml(entryLabel(current))}» (بر اساس ترتیب و سرجهٔ هرکس)</p>
          ${groupNote}
          ${renderPersonBlocksHtml(current)}
        </div>`;
    }
  } else {
    nowCardHtml = `
      <div class="now-card">
        <div class="now-card-icon">💧</div>
        <div class="label">وضعیت نوبت</div>
        <div class="jooy-name">خارج از بازهٔ برنامه‌ریزی‌شده</div>
      </div>`;
  }

  // Group entries into full-cycle chunks for readability (تعداد نوبت‌های هر چرخه به خاطر نوبت‌های ترکیبی ثابت نیست)
  const allCycles = [];
  entries.forEach(e => {
    let bucket = allCycles[allCycles.length-1];
    if(!bucket || bucket.cycleIndex !== e.cycleIndex){
      bucket = { cycleIndex: e.cycleIndex, items: [] };
      allCycles.push(bucket);
    }
    bucket.items.push(e);
  });
  // همه‌ی نوبت‌های گذشته (نه فقط ۲تای آخر) به‌صورت پیش‌فرض پشتِ دکمه می‌مونن — جوی‌های کاملاً
  // ردشده مثل قاسمعلی/طورانیها اصلاً لازم نیست پیش‌فرض دیده بشن. داخلِ خودِ نوبتِ فعلی (اگه
  // چندجویی باشه)، مالکینِ گذشته‌ش رو خودِ renderPersonBlocksHtml جدا به ۲تای آخر محدود می‌کنه.
  const startIdx = currentIdx >= 0 ? currentIdx : 0;
  const hiddenCount = startIdx;

  const pastToggleHtml = hiddenCount > 0 ? `
    <button class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:10px;" onclick="togglePastCycles()">
      ${showPastCycles ? '🔼 پنهان‌کردن جوی‌های گذشته' : `🔽 نمایش ${toFaDigits(hiddenCount)} جویِ گذشته`}
    </button>` : '';

  const renderCycleBlock = (cycle) => {
    const ci = allCycles.indexOf(cycle);
    const visibleItems = showPastCycles ? cycle.items : cycle.items.filter(e => entries.indexOf(e) >= startIdx);
    if(!visibleItems.length) return '';
    const rowsHtml = visibleItems.map(e => {
      const idx = entries.indexOf(e);
      const isCurrent = idx === currentIdx;
      const isPastRow = idx < currentIdx;

      // برای نوبتِ فعلی، اگه چندجوییِ ادغام‌شده باشه، به‌جای یه ردیفِ بزرگِ «اکنون» برای کل گروه،
      // مستقیم می‌شکونیمش به ردیف‌های تک‌تکِ مالکین (با همون منطقِ ۲تای‌گذشته/اکنون/آینده) — تا فقط
      // یه «اکنون» واقعی (سطحِ مالک/آبیار) تو کل صفحه بمونه، نه یکی برای کل گروه و یکی برای خودِ مالک.
      if(isCurrent && e.merged){
        return renderPersonBlocksHtml(e);
      }

      const key = e.start.getTime();
      const isOpen = expandedScheduleKeys.has(key);
      const detailHtml = isOpen ? `
        <div class="sched-detail">
          ${groupNoteHtmlForEntry(e, entries)}
          ${renderPersonBlocksHtml(e)}
        </div>` : '';
      return `
        <div class="sched-row sched-row-clickable ${isPastRow ? 'sched-row-past' : ''}" onclick="toggleScheduleEntry(${key})">
          <div class="sched-left">
            <div class="sched-jooy"><span class="sched-chevron">${isOpen ? '▾' : '◂'}</span> ${isPastRow ? '<span class=\"sched-badge sched-badge-past\">گذشت</span>' : ''}${escapeHtml(entryLabel(e))}${e.merged ? ' <span style="color:var(--water-blue);font-weight:700;" title="نوبت پیوسته چند جوی">🔗</span>' : ''}</div>
            <div class="sched-date" style="color:var(--header-green);font-weight:700;">${isCurrent ? `امروز — ${jalaliDateLabel(now)}` : relativeDayLabel(e.start, now)}</div>
          </div>
          <div class="sched-time">${timeLabel(e.start)} تا ${timeLabel(e.end)}</div>
        </div>
        ${detailHtml}`;
    }).join('');
    return `
      <div class="cycle-block">
        <p class="cycle-title">دورهٔ ${toFaDigits(ci+1)}${(current && cycle.items.includes(current) && currentJooyDisplayLabel) ? ` — <span class="cycle-title-jooy">${escapeHtml(currentJooyDisplayLabel)}</span>` : ''}</p>
        <div class="sched-list">${rowsHtml}</div>
      </div>`;
  };
  const cyclesHtml = allCycles.map(renderCycleBlock).join('');

  // خلاصهٔ همهٔ واگذاری‌ها — برای هر شخص، جدا به تفکیک هر جوی (تا نوبت‌های جوی‌های مختلف با هم قاطی نشن)
  const delegateGroups = {};
  state.records.forEach(r => {
    const name = (r.delegateName||'').trim();
    if(!name) return;
    if(!delegateGroups[name]) delegateGroups[name] = [];
    delegateGroups[name].push(r);
  });
  const delegateNames = Object.keys(delegateGroups).sort((a,b) => {
    const minJooyA = Math.min(...delegateGroups[a].map(x=>turnOrder.indexOf(x.jooyIndex)));
    const minJooyB = Math.min(...delegateGroups[b].map(x=>turnOrder.indexOf(x.jooyIndex)));
    if(minJooyA !== minJooyB) return minJooyA - minJooyB;
    // اگه هر دو اولین‌بار تو همون جوی ظاهر می‌شن، بر اساس کمترین شمارهٔ ردیف (نوبت) داخل همون جوی مرتب کن، نه الفبا
    const rowsInSameJooyA = delegateGroups[a].filter(x=>turnOrder.indexOf(x.jooyIndex)===minJooyA).map(x=>x.row);
    const rowsInSameJooyB = delegateGroups[b].filter(x=>turnOrder.indexOf(x.jooyIndex)===minJooyB).map(x=>x.row);
    const minRowA = Math.min(...rowsInSameJooyA);
    const minRowB = Math.min(...rowsInSameJooyB);
    if(minRowA !== minRowB) return minRowA - minRowB;
    return a.localeCompare(b,'fa');
  });
  const customSchedulesHtml = `
    <div class="jooy-names-card" style="margin-bottom:16px;">
      <p class="jooy-names-title" style="margin-bottom:8px;">📋 مدیریت گردش نوبت</p>
      <p class="loc-preview-hint" style="margin-bottom:10px;">وقتی نمی‌خوای برنامه از روی سرجه‌ها خودکار حساب کنه، و می‌خوای خودت دقیقاً بگی تو جوی(های) انتخابی، هفتهٔ اول کی به چه ترتیب چند ساعت آب داره، هفتهٔ دوم هم به چه ترتیب — این دو هفته همیشه جابه‌جا می‌چرخن.</p>
      ${customSchedules.length ? customSchedules.map(c => {
        const isConflicted = customSchedules.some(o => o.id !== c.id && o.jooyIndexes.some(gi => c.jooyIndexes.includes(gi)));
        return `
        <div class="loc-point-row" style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border:1px solid ${isConflicted?'#F5C6C2':'var(--paper-border)'};${isConflicted?'background:#FDECEA;':''}border-radius:8px;margin-bottom:6px;cursor:pointer;" onclick="startCustomScheduleEdit('${c.id}')">
          <span style="font-size:12px;">${isConflicted?'⚠️ ':''}جوی ${c.jooyIndexes.length ? c.jooyIndexes.map(gi=>escapeHtml(groupLabel(gi))).join(' + ') : '(هنوز انتخاب نشده)'} — هفتهٔ ۱: ${(c.weeks[0]||[]).length ? toFaDigits((c.weeks[0]||[]).length)+' نفر' : 'خالی'} · هفتهٔ ۲: ${(c.weeks[1]||[]).length ? toFaDigits((c.weeks[1]||[]).length)+' نفر' : 'خالی'}${isConflicted?' — این گروه غیرفعاله!':''}</span>
          <span style="font-size:11px;color:var(--ink-faint);">ویرایش ›</span>
        </div>`;}).join('') : ''}
      <button class="btn btn-ghost" style="width:100%;justify-content:center;border:2px dashed var(--sea);color:var(--sea);font-weight:700;margin-top:6px;" onclick="createCustomSchedule()">➕ مدیریتِ گردشِ نوبتِ جدید</button>
    </div>`;
  // دقیقهٔ واقعیِ هر واگذاری در هر جوی — دقیقاً همون محاسبه‌ای که تو «نوبت آبیاری» استفاده می‌شه (نه تقریبِ ثابتِ ۱۶ دقیقه‌ای)،
  // تا عدد ساعتِ تب «واگذاری‌ها» با عددِ تب «نوبت آبیاری» یکی باشه و اختلاف چند دقیقه‌ای نداشته باشن.
  // نکته: تو جوی‌هایی که «گروه چرخشی سفارشی» دارن، سهمِ هرکس دیگه از هر چرخه فرق می‌کنه (مثلاً یکی فقط
  // یه چرخه از هر N چرخه نوبتشه)، پس نمونه‌گرفتنِ فقط یه چرخه (مثل قبل) عددِ گمراه‌کننده می‌ده. برای این
  // جوی‌ها، باید از تمومِ چرخه‌های الگو (همهٔ فازها) نمونه بگیریم و میانگین بگیریم تا عدد واقعاً معنی‌دار باشه.
  const realMinutesByJooyDelegate = {};
  {
    const processedJooys = new Set();
    const customSampledPhases = {}; // scheduleId -> Set(weekIdx) که تا الان نمونه گرفتیم
    for (const e of entries){
      const jooysInEntry = e.merged ? e.jooyIndexes : [e.groupIdx];
      const schedWeeksLen = e.customSchedule ? (e.customSchedule.weeks.filter(w=>Array.isArray(w)).length || 1) : 1;
      let phaseAlreadySampled = false;
      if(e.customSchedule){
        const weekIdx = (e.cycleIndex||0) % schedWeeksLen;
        const set = customSampledPhases[e.customSchedule.id] || (customSampledPhases[e.customSchedule.id] = new Set());
        phaseAlreadySampled = set.has(weekIdx);
      }
      const jooysFullyDone = jooysInEntry.every(gi => processedJooys.has(gi));
      if(jooysFullyDone && (!e.customSchedule || phaseAlreadySampled)) continue;
      if(e.customSchedule && phaseAlreadySampled) continue;

      computeSlotsForEntry(e).forEach(s => {
        const name = s.delegateName || (e.customSchedule ? s.effectiveOwner : '');
        if(!name) return;
        if(!realMinutesByJooyDelegate[s.jooyIndex]) realMinutesByJooyDelegate[s.jooyIndex] = {};
        realMinutesByJooyDelegate[s.jooyIndex][name] = (realMinutesByJooyDelegate[s.jooyIndex][name]||0) + ((s.end - s.start)/60000)/schedWeeksLen;
      });

      if(e.customSchedule){
        const weekIdx = (e.cycleIndex||0) % schedWeeksLen;
        customSampledPhases[e.customSchedule.id].add(weekIdx);
        if(customSampledPhases[e.customSchedule.id].size >= schedWeeksLen){
          jooysInEntry.forEach(gi => processedJooys.add(gi));
        }
      } else {
        jooysInEntry.forEach(gi => processedJooys.add(gi));
      }
      if(processedJooys.size >= turnOrder.length) break;
    }
  }

  const delegatesSummaryHtml = delegateNames.length ? `
    <div class="jooy-names-card" style="margin-bottom:16px;">
      <p class="jooy-names-title" style="margin-bottom:8px;">🤝 جمع سرجه و آبیاری نوبت‌های واگذارشده (به تفکیک هر جوی)</p>
      ${delegateNames.map(name => {
        const rows = delegateGroups[name];
        const grandTotal = rows.reduce((s,x)=>s+(Number(x.amount)||0),0);
        // همون شخص رو در هر جوی که توش سرجه داره، جدا و مستقل از جوی‌های دیگه‌اش نشون می‌دیم
        const byJooy = {};
        rows.forEach(x => {
          if(!byJooy[x.jooyIndex]) byJooy[x.jooyIndex] = [];
          byJooy[x.jooyIndex].push(x);
        });
        const jooyIdxs = Object.keys(byJooy).map(Number).sort((a,b) => turnOrder.indexOf(a) - turnOrder.indexOf(b));
        const isCardLive = rows.some(x => x.id === liveRecordId);
        // قبلاً اینجا سعی می‌شد از روی «دقیقهٔ واقعیِ» نمونه‌گیری‌شده از اسلات‌های نمایش‌داده‌شده (که فقط
        // یه بازهٔ محدود از چرخه‌ها رو پوشش می‌دن، نه لزوماً همهٔ نوبت‌های این شخص در این جوی) ساعت حساب بشه؛
        // چون اون نمونه‌گیری کامل نبود، عدد ساعت گاهی کمتر از مقدار واقعیِ سرجه×۱۶‌دقیقه در می‌اومد.
        // برای اینکه همیشه با قانون ثابتِ «هر سرجه = ۱۶ دقیقه» همخوانی داشته باشه، مستقیم از روی جمع سرجه حساب می‌کنیم.
        const grandTimeText = minutesToHourMinText(grandTotal*16);
        return `
        <div class="plot-card" style="border:2px solid ${isCardLive ? '#F2B705' : 'var(--water-blue)'}; ${isCardLive ? 'background:#FFF8E1;' : ''} border-radius:12px; padding:10px; margin-bottom:12px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
            <b style="color:${isCardLive ? '#8A6D00' : 'var(--water-blue)'};">${isCardLive ? '<span class="sched-badge">اکنون</span> ' : ''}🤝 ${escapeHtml(name)}</b>
            <span style="font-size:12px; font-weight:700; color:var(--clay);">جمع کل: ${grandTotal} سرجه (${grandTimeText})</span>
          </div>
          ${jooyIdxs.map(gi => {
            const jRows = byJooy[gi].slice().sort((a,b)=>a.row-b.row);
            const jTotal = jRows.reduce((s,x)=>s+(Number(x.amount)||0),0);
            const isRowLive = jRows.some(x => x.id === liveRecordId);
            const namesList = jRows.map(x=>escapeHtml(x.owner)).join('، ');
            // همون دلیلِ بالا: به‌جای دقیقهٔ واقعیِ نمونه‌گیری‌شده (که ناقص بود)، مستقیم از سرجه×۱۶‌دقیقه حساب می‌کنیم.
            const timeText = minutesToHourMinText(jTotal*16);
            return `
            <div class="loc-point-row" style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border:1px solid ${isRowLive ? '#F2B705' : 'var(--paper-border)'};${isRowLive ? 'background:#FFF3C4;' : ''}border-radius:8px;margin-bottom:6px;">
              <div>
                <div style="font-size:12px;font-weight:700;">${isRowLive ? '<span class="sched-badge">اکنون</span> ' : ''}جوی ${escapeHtml(groupLabel(gi))}</div>
                <div style="font-size:11px;color:var(--ink-faint);">${toFaDigits(jRows.length)} نوبت: ${namesList}</div>
              </div>
              <div style="font-size:12px;font-weight:700;color:var(--clay);">${jTotal} سرجه (${timeText})</div>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>` : '';

  if(state.scheduleSubTab === undefined) state.scheduleSubTab = 'main';

  const subTabBarHtml = `
    <div class="schedule-subtabs">
      <button class="schedule-subtab-btn ${state.scheduleSubTab==='main'?'active':''}" onclick="setScheduleSubTab('main')">📅 برنامهٔ نوبت‌ها</button>
      <button class="schedule-subtab-btn ${state.scheduleSubTab==='delegates'?'active':''}" onclick="setScheduleSubTab('delegates')">🤝 واگذاری‌ها${delegateNames.length ? ` (${toFaDigits(delegateNames.length)})` : ''}</button>
      <button class="schedule-subtab-btn ${state.scheduleSubTab==='turns'?'active':''}" onclick="setScheduleSubTab('turns')">📋 مدیریت گردش نوبت${customSchedules.length ? ` (${toFaDigits(customSchedules.length)})` : ''}</button>
    </div>`;

  view.innerHTML = state.scheduleSubTab === 'delegates'
    ? `${subTabBarHtml}${delegatesSummaryHtml || '<div class="payment-empty">هنوز هیچ نوبتی به کسی واگذار نشده.</div>'}`
    : state.scheduleSubTab === 'turns'
    ? `${subTabBarHtml}${customSchedulesHtml}`
    : `${subTabBarHtml}${nowCardHtml}${pastToggleHtml}${cyclesHtml}`;
}

function setScheduleSubTab(tab){
  state.scheduleSubTab = tab;
  renderSchedule();
}

/* ---------------- Lands overview map ---------------- */
let landsMapInstance = null;

// فیلتر نمایش تکی یه پلاک خاص روی نقشهٔ کلی تب زمین‌ها رو تنظیم می‌کنه (خالی یعنی نمایش همه)
function setLandsFilter(key){
  state.landsFilterKey = key || null;
  renderLands();
}

function renderLands(){
  const view = document.getElementById('landsView');
  const located = state.records.filter(r => getPlots(r).length > 0);
  // یه ردیف جدا برای هر «پلاک» (نه هر نقطه یا هر مالک) می‌سازیم، چون زمین‌های جدای یه مالک نباید قاطی بشن
  const plotRows = [];
  located.forEach(r => {
    getPlots(r).forEach((plot, pIdx) => plotRows.push({r, plot, pIdx}));
  });
  const totalPoints = plotRows.reduce((s, pr) => s + pr.plot.points.length, 0);

  view.innerHTML = `
    <div class="jooy-names-card" style="margin-bottom:16px;">
      <p class="jooy-names-title" style="margin-bottom:0;">
        ${located.length} مالک از ${state.records.length} سرجه تا الان مختصات ثبت‌شده دارند — جمعاً ${plotRows.length} پلاک/تکه زمین (${totalPoints} نقطه).
        از تب «سرجه‌ها»، روی هر ردیف بزنید و «ثبت موقعیت زمین» را انتخاب کنید.
      </p>
    </div>
    ${plotRows.length > 1 ? `
    <div class="edit-field" style="margin-bottom:10px;">
      <label>نمایش روی نقشه</label>
      <select class="edit-input" id="lands-filter-select" onchange="setLandsFilter(this.value)">
        <option value="">همهٔ پلاک‌ها با هم</option>
        ${plotRows.map(({r, plot, pIdx}) => {
          const key = `${r.id}::${pIdx}`;
          const plotCountForOwner = getPlots(r).length;
          const optLabel = `${r.owner}${plotCountForOwner > 1 ? ` — پلاک ${pIdx+1}` : ''}`;
          return `<option value="${key}" ${state.landsFilterKey===key?'selected':''}>${escapeHtml(optLabel)}</option>`;
        }).join('')}
      </select>
    </div>` : ''}
    <div id="landsMap" class="lands-map"></div>
    <div class="sched-list" style="margin-top:16px;">
      ${plotRows.length === 0 ? '<div class="payment-empty">هنوز هیچ زمینی ثبت نشده است.</div>' : plotRows.map(({r, plot, pIdx}) => {
        const plotCountForOwner = getPlots(r).length;
        const areaVal = plot.manualArea != null ? plot.manualArea : (plot.points.length >= 3 ? computePolygonAreaSqm(plot.points) : null);
        const areaBadge = areaVal != null ? ` · 📐 ${formatArea(areaVal)}${plot.manualArea != null ? ' (دستی)' : ''}` : '';
        const plaqueBadge = plot.plaqueNote ? ` · 🏷️ ${escapeHtml(plot.plaqueNote)}` : '';
        const firstPoint = plot.points[0];
        const edges = plotEdgeLengths(plot.points);
        const edgesLine = edges.length ? `<div class="sched-date" style="margin-top:2px;">📏 اضلاع: ${edges.map(m => `${m.toLocaleString('fa-IR',{maximumFractionDigits:1})} متر`).join(' · ')}</div>` : '';
        return `
        <div class="sched-row" style="border-right:4px solid ${colorForPlot(pIdx)}; flex-wrap:wrap;">
          <div class="sched-left">
            <div class="sched-jooy">${escapeHtml(r.owner)}${plotCountForOwner > 1 ? ` — پلاک ${toFaDigits(pIdx+1)}` : ''} (${toFaDigits(plot.points.length)} نقطه)${areaBadge}</div>
            <div class="sched-date">جوی ${escapeHtml(groupLabel(r.jooyIndex))}${firstPoint ? ` · ${firstPoint.lat.toFixed(5)}, ${firstPoint.lng.toFixed(5)}` : ''}${plaqueBadge}</div>
            ${edgesLine}
          </div>
          ${firstPoint ? `<a class="btn btn-map" style="padding:6px 12px;font-size:11px;" href="https://www.google.com/maps?q=${firstPoint.lat},${firstPoint.lng}" target="_blank" rel="noopener">نقشه</a>` : ''}
        </div>`;
      }).join('')}
    </div>
  `;

  if(landsMapInstance){
    landsMapInstance.remove();
    landsMapInstance = null;
  }
  if(plotRows.length === 0) return;

  whenLeafletReady(() => {
    const mapEl = document.getElementById('landsMap');
    if(!mapEl) return; // کاربر از تب خارج شده

    if(landsMapInstance){
      landsMapInstance.remove();
      landsMapInstance = null;
    }

    landsMapInstance = L.map('landsMap');
    const landsStreetLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap contributors © CARTO', subdomains: 'abcd', maxZoom: 20,
    }).addTo(landsMapInstance);
    const landsSatLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri World Imagery', maxZoom: 20,
    });
    const landsGoogleSatLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      attribution: '© Google', subdomains: ['0','1','2','3'], maxZoom: 21,
    });
    L.control.layers({ '🗺️ نقشه خیابانی': landsStreetLayer, '🛰️ ماهواره (Esri)': landsSatLayer, '🛰️ ماهواره (گوگل - وضوح بالاتر)': landsGoogleSatLayer }, null, { position: 'topleft', collapsed: true }).addTo(landsMapInstance);

    const markers = [];
    // هر پلاک با یه رنگ ثابت مخصوص خودش (بر اساس شمارهٔ پلاک آن مالک) رسم می‌شه — پلاک‌های جدای یه مالک با هم قاطی نمی‌شن
    // اگه فیلتر «نمایش تکی» فعال باشه، فقط همون پلاک انتخاب‌شده رسم می‌شه
    plotRows.forEach(({r, plot, pIdx}) => {
      if(state.landsFilterKey && state.landsFilterKey !== `${r.id}::${pIdx}`) return;
      const color = colorForPlot(pIdx);
      const plotCountForOwner = getPlots(r).length;
      const areaVal = plot.manualArea != null ? plot.manualArea : (plot.points.length >= 3 ? computePolygonAreaSqm(plot.points) : null);
      const areaLine = areaVal != null ? `<br/>📐 ${formatArea(areaVal)}${plot.manualArea != null ? ' (دستی)' : ''}` : '';
      const plaqueLine2 = plot.plaqueNote ? `<br/>🏷️ ${escapeHtml(plot.plaqueNote)}` : '';
      const label = `<b>${escapeHtml(r.owner)}</b>${plotCountForOwner > 1 ? ` — پلاک ${toFaDigits(pIdx+1)}` : ''}<br/>جوی ${groupLabel(r.jooyIndex)}<br/>${r.amount} سرجه${areaLine}${plaqueLine2}`;

      plot.points.forEach((p, i) => {
        let m;
        if(plot.points.length > 1){
          const numberedIcon = L.divIcon({
            className: 'loc-numbered-marker',
            html: `<div style="background:${color};color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);">${i+1}</div>`,
            iconSize: [22,22], iconAnchor: [11,11]
          });
          m = L.marker([p.lat, p.lng], { icon: numberedIcon }).addTo(landsMapInstance);
        } else {
          m = L.marker([p.lat, p.lng]).addTo(landsMapInstance);
        }
        m.bindPopup(label);
        markers.push(m);
      });

      // اگه ۳ نقطه یا بیشتر داره، محدودهٔ چندضلعی‌اش رو هم با همون رنگ رسم می‌کنیم
      if(plot.points.length >= 3){
        L.polygon(plot.points.map(p => [p.lat, p.lng]), {
          color, weight: 2, fillColor: color, fillOpacity: 0.15
        }).addTo(landsMapInstance).bindPopup(label);
      }

      // وسط هر ضلع، طولش رو به متر می‌نویسیم (برای دیدن سریع اندازهٔ هر ضلع روی نقشه)
      if(plot.points.length >= 2){
        const n = plot.points.length;
        const edgeCount = plot.points.length >= 3 ? n : n - 1;
        for(let i = 0; i < edgeCount; i++){
          const a = plot.points[i];
          const b = plot.points[(i+1) % n];
          const midLat = (a.lat + b.lat) / 2;
          const midLng = (a.lng + b.lng) / 2;
          const meters = distanceMeters(a, b);
          const angle = edgeLabelAngleDeg(a, b);
          const edgeLabelIcon = L.divIcon({
            className: 'edge-length-label',
            html: `<div style="background:#fff;color:${color};border:1px solid ${color};border-radius:6px;padding:2px 6px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3);transform:rotate(${angle}deg);">${meters.toLocaleString('fa-IR',{maximumFractionDigits:1})} متر</div>`,
            iconSize: [60,22], iconAnchor: [30,11]
          });
          L.marker([midLat, midLng], { icon: edgeLabelIcon, interactive: false }).addTo(landsMapInstance);
        }
      }
    });

    if(markers.length === 1){
      const only = markers[0].getLatLng();
      landsMapInstance.setView([only.lat, only.lng], 15);
    } else if(markers.length > 1){
      const group = L.featureGroup(markers);
      landsMapInstance.fitBounds(group.getBounds().pad(0.2));
    }

    setTimeout(() => { if(landsMapInstance) landsMapInstance.invalidateSize(); }, 250);
  });
}

// همهٔ چیزهایی که توی localStorage ذخیره شده رو (سرجه‌ها، پرداختی‌ها، اسم جوی‌ها، ترتیب نوبت) توی یه فایل JSON دانلود می‌کنه
// فایلِ پشتیبان رو می‌سازه و دانلودش می‌کنه؛ کلِ منطقِ ساختِ فایل یه‌جا هست تا هم دکمهٔ دستیِ
// «پشتیبان‌گیری از همهٔ داده‌ها» و هم دکمهٔ «پشتیبانِ فوری» از همینا استفاده کنن، نه دو تا نسخهٔ جدا
function downloadBackupFile(){
  const backup = {
    app: 'qanat-faran',
    version: 1,
    exportedAt: new Date().toISOString(),
    data: {
      [STORAGE_KEY]: localStorage.getItem(STORAGE_KEY),
      [PAYMENTS_KEY]: localStorage.getItem(PAYMENTS_KEY),
      [GROUP_NAMES_KEY]: localStorage.getItem(GROUP_NAMES_KEY),
      [JOOY_ORDER_KEY]: localStorage.getItem(JOOY_ORDER_KEY),
      [PHONES_KEY]: localStorage.getItem(PHONES_KEY),
      [ROTATION_GROUPS_KEY]: localStorage.getItem(ROTATION_GROUPS_KEY),
      [DELEGATE_LOANS_KEY]: localStorage.getItem(DELEGATE_LOANS_KEY),
      [CUSTOM_SCHEDULES_KEY]: localStorage.getItem(CUSTOM_SCHEDULES_KEY),
    }
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}`;
  a.href = url;
  a.download = `پشتیبان-قنات-فران-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function fetchAllAutoBackups(){
  const hourlyKeys = Array.from({length:AUTO_BACKUP_HOURLY_SLOTS}, (_,i)=>`auto_backup_hourly_${i}`);
  const dailyKeys = Array.from({length:AUTO_BACKUP_DAILY_SLOTS}, (_,i)=>`auto_backup_daily_${i}`);
  const allKeys = [...hourlyKeys, ...dailyKeys];
  const results = await Promise.all(allKeys.map(k => csGetRemote(k)));
  const list = results
    .map((snap, i) => snap ? { key: allKeys[i], kind: i < hourlyKeys.length ? 'hourly' : 'daily', snapshot: snap } : null)
    .filter(Boolean)
    .filter((v, idx, arr) => arr.findIndex(x => x.snapshot.timestamp === v.snapshot.timestamp) === idx) // حذفِ نسخه‌های کاملاً تکراری
    .sort((a,b) => new Date(b.snapshot.timestamp) - new Date(a.snapshot.timestamp));
  return list;
}

    // مثل بازیابی از فایل: لیستِ «حذف‌شده‌ها» رو هم پاک می‌کنیم، وگرنه سرجه‌هایی که تو این پشتیبان
    // هستن ولی آیدی‌شون قبلاً یه‌جا حذف شده بود، همون لحظه دوباره فیلتر و پاک می‌شن
    deletedRecordIds = new Set();
    try{ localStorage.setItem(DELETED_IDS_KEY, '[]'); }catch(e){}

    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records));

const CS_KEY_MAP = {
  [STORAGE_KEY]: 'records',
  [PAYMENTS_KEY]: 'payments',
  [PHONES_KEY]: 'person_phones',
  [GROUP_NAMES_KEY]: 'group_names',
  [JOOY_ORDER_KEY]: 'jooy_order',
  [ROTATION_GROUPS_KEY]: 'rotation_groups',
  [DELEGATE_LOANS_KEY]: 'delegate_loans',
  [CUSTOM_SCHEDULES_KEY]: 'custom_schedules',
  [DELETED_IDS_KEY]: 'deleted_ids',
};

// یه فایل پشتیبان قبلی رو می‌خونه و جایگزین داده‌های فعلی می‌کنه (بعد از تأیید کاربر)
function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup || !backup.data){
        alert('این فایل، فایل پشتیبان معتبر قنات فران نیست.');
        return;
      }
      const confirmMsg = 'با تأیید این کار، تمام داده‌های فعلی (سرجه‌ها، مختصات، پرداختی‌ها) با محتوای این فایل پشتیبان جایگزین می‌شه — هم روی این گوشی و هم روی سرور. این کار قابل بازگشت نیست (مگر اینکه از وضعیت فعلی هم قبلش پشتیبان گرفته باشید). مطمئنید؟';
      if(!confirm(confirmMsg)) return;

      // اول روی گوشی می‌نویسیم (فوری)
      Object.entries(backup.data).forEach(([key, value]) => {
        if(value != null) localStorage.setItem(key, value);
      });

      // مهم: لیستِ «آیدیِ سرجه‌های حذف‌شده» (تومب‌استون‌ها) رو هم خالی می‌کنیم — وگرنه هر سرجه‌ای که توی
      // این فایل پشتیبان هست ولی آیدی‌اش قبلاً یه‌جا حذف شده بود، همون لحظه‌ی بارگذاری دوباره فیلتر و
      // پاک می‌شه (چون این لیست مستقل از فایل پشتیبانه) و کاربر فکر می‌کنه بازیابی اصلاً اثر نکرده.
      // چون کاربر صریحاً گفته «همه‌چیز رو با این فایل جایگزین کن»، درسته که این لیست هم پاک بشه.
      if(!(DELETED_IDS_KEY in backup.data)){
        backup.data[DELETED_IDS_KEY] = '[]';
      }
      try{ localStorage.setItem(DELETED_IDS_KEY, '[]'); }catch(e){}
      deletedRecordIds = new Set();

      // حیاتی: متغیرهای درون‌حافظه‌ای (state.records و بقیه) رو هم همین‌جا با محتوای پشتیبان به‌روز می‌کنیم،
      // نه فقط localStorage. چون درست همون لحظه‌ای که پایین‌تر location.reload() صدا زده می‌شه، مرورگر
      // رویدادهای pagehide/beforeunload رو هم شلیک می‌کنه که flushSave() رو اجرا می‌کنن؛ flushSave همیشه از
      // روی همین متغیرهای درون‌حافظه‌ای (نه از روی فایل پشتیبان) دوباره توی localStorage می‌نویسه و به
      // سرور هم push می‌کنه. اگه این متغیرها همچنان مقدار قدیمیِ قبل از بازیابی رو داشته باشن، همون
      // نوشتنِ خودکارِ flushSave، درست قبل از رفرش، کل بازیابی رو بی‌صدا خنثی می‌کنه — همون چیزی که باعث
      // می‌شد پیام «موفقیت‌آمیز» بیاد ولی هیچی عملاً عوض نشه.
      try{
        if(backup.data[STORAGE_KEY] != null) state.records = JSON.parse(backup.data[STORAGE_KEY]).map(migrateRecordToPlots);
        if(backup.data[PAYMENTS_KEY] != null) state.payments = JSON.parse(backup.data[PAYMENTS_KEY]);
        if(backup.data[PHONES_KEY] != null) personPhones = JSON.parse(backup.data[PHONES_KEY]);
        if(backup.data[GROUP_NAMES_KEY] != null) customGroupNames = JSON.parse(backup.data[GROUP_NAMES_KEY]);
        if(backup.data[JOOY_ORDER_KEY] != null) turnOrder = JSON.parse(backup.data[JOOY_ORDER_KEY]);
        if(backup.data[ROTATION_GROUPS_KEY] != null) rotationGroups = JSON.parse(backup.data[ROTATION_GROUPS_KEY]).map(normalizeRotationGroup);
        if(backup.data[DELEGATE_LOANS_KEY] != null) delegateLoans = JSON.parse(backup.data[DELEGATE_LOANS_KEY]);
        if(backup.data[CUSTOM_SCHEDULES_KEY] != null) customSchedules = JSON.parse(backup.data[CUSTOM_SCHEDULES_KEY]);
      }catch(e){
        alert('فایل پشتیبان خونده شد ولی توی تبدیل بعضی بخش‌ها خطا داد: ' + e.message + '\nبقیهٔ بازیابی ادامه پیدا می‌کنه.');
      }

      // بعد همون مقادیر رو روی سرور هم می‌نویسیم، وگرنه موقع رفرش با نسخه‌ی
      // قدیمیِ سرور دوباره ادغام می‌شه و بازیابی بی‌اثر می‌مونه
      alert('در حال همگام‌سازی با سرور... چند ثانیه صبر کنید.');
      const pushResults = await Promise.all(
        Object.entries(backup.data).map(async ([key, value]) => {
          const csKey = CS_KEY_MAP[key];
          if(!csKey || value == null) return true;
          try{
            const parsed = typeof value === 'string' ? JSON.parse(value) : value;
            return await csSetRemote(csKey, parsed);
          }catch(e){ return false; }
        })
      );

      // نکتهٔ مهم: بلافاصله بعد از این، صفحه رفرش می‌شه و pullFromCloud() اجرا می‌شه که
      // داده‌های گوشی رو با سرور «ادغام» می‌کنه — و توی اون ادغام، برای هر آیدیِ مشترک،
      // نسخهٔ سرور برنده می‌شه. اگه push بالا (حتی فقط برای یکی از کلیدها) ناموفق شده باشه،
      // سرور هنوز نسخهٔ قدیمی رو داره و همون ادغام، بازیابی رو بی‌صدا خنثی می‌کنه.
      // برای همین یه پرچم می‌ذاریم که یه‌بار، بلافاصله بعد از این رفرش، pullFromCloud()
      // اجرا نشه — چون دادهٔ روی گوشی (که همین الان از فایل پشتیبان نوشتیم) باید معتبر باشه.
      try{ sessionStorage.setItem('faran_skip_next_pull', '1'); }catch(e){}

      if(pushResults.some(ok => !ok)){
        alert('بازیابی روی گوشی انجام شد، ولی همگام‌سازی با سرور برای بعضی بخش‌ها ناموفق بود (اینترنت رو چک کنید). صفحه بارگذاری مجدد می‌شه؛ داده‌های بازیابی‌شده روی گوشی می‌مونن، ولی بعداً دوباره روی «ذخیره در سرور» بزنید تا سرور هم کامل به‌روز بشه.');
      } else {
        alert('بازیابی با موفقیت انجام شد (هم روی گوشی، هم روی سرور). صفحه بارگذاری مجدد می‌شه.');
      }
      location.reload();
    }catch(err){
      alert('خواندن فایل پشتیبان ناموفق بود: ' + err.message);
    }
  };
  reader.readAsText(file);
}

/* ---------------- Init ---------------- */
document.addEventListener('DOMContentLoaded', () => {
  state.records = loadRecords();
  state.payments = loadPayments();
  if(isShowingLocalFallback) showLocalFallbackWarning(1);
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  setTab('records');
  render();
  renderJooyNamesForm();
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if(e.key === 'Enter') runSearch();
  });
  updateDateTime();
  setInterval(updateDateTime, 1000);

  // تب «نوبت آبیاری» رو هر یه دقیقه دوباره می‌سازیم (اگه باز باشه)، تا کارت «الان نوبت» و برچسب‌های
  // امروز/فردا و «اکنون» بدون نیاز به رفرش دستی، خودشون رو نسبت به ساعتِ واقعی به‌روز نگه دارن
  setInterval(() => {
    if(state.activeTab === 'schedule') renderSchedule();
  }, 60000);

  // یه بار از سرور می‌خونیم — چون localStorage همین گوشی ممکنه چیزی کم داشته باشه
  // (مثلاً روی گوشی/مرورگر دیگه‌ای ثبت شده، یا اینجا پاک شده) و باید از سرور جبران بشه.
  // استثنا: اگه همین الان از یه فایل پشتیبان بازیابی کردیم، این یه بار رو رد می‌کنیم — چون
  // ادغام با سرور برای هر آیدیِ مشترک به نفع سرور تموم می‌شه و می‌تونه بی‌صدا بازیابی رو خنثی کنه.
  let skipPull = false;
  try{ skipPull = sessionStorage.getItem('faran_skip_next_pull') === '1'; sessionStorage.removeItem('faran_skip_next_pull'); }catch(e){}
  // اول هر چیزی که از دفعهٔ قبل نصفه‌کاره مونده (مثلاً یه حذف که به سرور نرسیده بود) رو می‌فرستیم،
  // بعد میریم سراغ خوندن از سرور — تا merge روی نسخهٔ به‌روزتر انجام بشه، نه نسخهٔ قدیمیِ سرور
  flushPendingSync().then(() => { if(!skipPull) pullFromCloudWithRetry(); });

  // پشتیبانِ خودکارِ ابری: یه بار کمی بعد از بازشدنِ صفحه (تا pullFromCloud فرصت کنه داده‌های واقعی رو
  // بیاره)، بعدش هر ۳ ساعت یه‌بار، یه نسخه از همهٔ داده‌ها رو تو یه جای جدا روی سرور نگه می‌داریم
  setTimeout(pushAutoBackup, 15000);
  setInterval(pushAutoBackup, 3*3600*1000);

  // ذخیرهٔ خودکار دورهٔ‌ای (هر ۲ دقیقه) به‌عنوان شبکهٔ ایمنی — علاوه بر ذخیرهٔ فوریِ هر تغییر.
  // مهم: اگه این تب «قدیمی» تشخیص داده بشه (یه تبِ جدیدتر از همین سایت بعدش باز شده)، این‌جا
  // دیگه هیچ‌چی رو خودکار به سرور نمی‌فرسته — دقیقاً همون چیزی که قبلاً نبود و باعث می‌شد یه تبِ
  // فراموش‌شده با دیتای قدیمی، بی‌صدا و کاملاً «موفق»، نسخهٔ خوب رو با نسخهٔ کهنه بازنویسی کنه.
  setInterval(() => {
    if(isStaleTab()){ warnIfStaleTab(); return; }
    saveRecords(state.records, true);
    savePayments(state.payments);
    flushPendingSync(); // اگه چیزی از قبل نصفه‌کاره مونده، این‌جا دوباره امتحان می‌شه
  }, 120000);

  // ذخیرهٔ فوری دقیقاً لحظه‌ای که صفحه می‌ره پس‌زمینه یا داره بسته می‌شه — مهم‌تر از تایمر دوره‌ای،
  // چون درست همون لحظه‌ای که ریسک از دست رفتن داده هست رو پوشش می‌ده؛ یه پشتیبانِ خودکار هم همون لحظه می‌گیریم.
  // همینجا هم همون محافظِ «تب قدیمی» رو می‌ذاریم.
  const flushSave = () => {
    if(isStaleTab()) return;
    saveRecords(state.records, true);
    savePayments(state.payments);
    pushAutoBackup();
  };
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden') flushSave();
    else if(document.visibilityState === 'visible'){
      // وقتی برمی‌گردیم به تب (مثلاً از تلگرام یا مرورگر دیگه)، اول چک می‌کنیم این تب قدیمی نشده؛
      // اگه نشده، هر چیزی که موقع رفتن به پس‌زمینه نصفه‌کاره مونده بود رو همین‌جا دوباره امتحان می‌کنیم
      if(isStaleTab()) warnIfStaleTab();
      else flushPendingSync();
    }
  });
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('beforeunload', flushSave);
});
</script>
